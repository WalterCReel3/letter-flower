<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Letter Flower (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one column garden; growing plant beside the score, the letter flower is the hero, found words below. */
:root{
  --sky:#eef6f7; --card:#ffffff; --ink:#23323a; --muted:#5d6f78;
  --petal:#ffd6e3; --petal-ink:#7a1f45; --center:#ffc93c; --center-ink:#3d2a00;
  --leaf:#3f9b5a; --leaf-soft:#d5efdc; --line:#cfe1e4; --warn:#b5452b;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#142227; --card:#1c2e34; --ink:#eaf3f4; --muted:#a6bac0;
  --petal:#6b2a46; --petal-ink:#ffe3ee; --center:#f2b827; --center-ink:#2a1c00;
  --leaf:#6fcf8a; --leaf-soft:#20402c; --line:#2f4950; --warn:#ff9a7f; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#142227; --card:#1c2e34; --ink:#eaf3f4; --muted:#a6bac0;
  --petal:#6b2a46; --petal-ink:#ffe3ee; --center:#f2b827; --center-ink:#2a1c00;
  --leaf:#6fcf8a; --leaf-soft:#20402c; --line:#2f4950; --warn:#ff9a7f; color-scheme:dark}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--read);padding-inline:16px;padding-block:12px 28px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;margin:0;line-height:1;text-wrap:balance}
.tools{display:flex;gap:8px}
.chip{font:700 .95rem var(--read);background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="false"]{color:var(--muted)}
.score{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 16px}
.score svg{flex:none}
.rank{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1}
.count{color:var(--muted);font-size:1.05rem}
.word{min-height:64px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:700;letter-spacing:.06em;text-align:center;overflow-wrap:anywhere}
.word .c{color:var(--leaf)}
.word .caret{display:inline-block;width:3px;height:1em;background:var(--ink);margin-left:4px;animation:blink 1s steps(1) infinite;vertical-align:-.12em}
@keyframes blink{50%{opacity:0}}
.msg{min-height:2rem;text-align:center;font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--leaf)}
.msg.no{color:var(--warn)}
.flower{position:relative;width:min(300px,86vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.flower button{position:absolute;width:31%;aspect-ratio:1;border-radius:50%;border:none;font:700 clamp(2rem,10vw,2.8rem) var(--read);cursor:pointer;transform:translate(-50%,-50%);transition:transform .12s;touch-action:manipulation;padding:0 0 .12em}
.flower button.o{background:var(--petal);color:var(--petal-ink)}
.flower button.m{background:var(--center);color:var(--center-ink);box-shadow:0 0 0 6px var(--leaf-soft)}
.flower button:active{transform:translate(-50%,-50%) scale(.9)}
.flower button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:4px solid var(--leaf);outline-offset:3px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn{font:800 1.2rem var(--display);border-radius:999px;padding:10px 20px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;min-width:96px;touch-action:manipulation}
.actions.main{flex-wrap:nowrap;gap:8px;max-width:340px;margin:0 auto;width:100%}
.actions.main .btn{flex:1 1 0;min-width:0;padding:8px 6px;font-size:1.05rem;white-space:nowrap}
.btn.go{background:var(--leaf);border-color:var(--leaf);color:var(--card)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-family:var(--display);font-size:1.15rem}
.found{display:flex;flex-wrap:wrap;gap:8px}
.found span.bonus{background:var(--petal);color:var(--petal-ink)}
.note{font-size:.95rem;color:var(--muted);margin:0}
.found span{background:var(--leaf-soft);border-radius:12px;padding:4px 12px;font-size:1.3rem;font-weight:700;cursor:pointer}
.empty{color:var(--muted)}
.left{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:1.05rem}
.left b{color:var(--ink)}
.hintline{font-size:1.6rem;letter-spacing:.15em;font-weight:700;min-height:1.6em}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted)}
.grow{transition:all .5s}
@media (prefers-reduced-motion:reduce){.grow,.flower button{transition:none}.word .caret{animation:none}}
</style>

<div class="wrap">
  <header>
    <h1>Letter Flower</h1>
    <div class="tools">
      <button class="chip" id="sound" aria-pressed="true">🔊 Sound on</button>
    </div>
  </header>

  <div class="score">
    <svg id="plant" width="64" height="72" viewBox="0 0 64 72" aria-hidden="true">
      <rect x="10" y="60" width="44" height="12" rx="4" fill="var(--warn)" opacity=".75"/>
      <rect id="stem" class="grow" x="30" y="60" width="4" height="0" rx="2" fill="var(--leaf)"/>
      <ellipse id="leafL" class="grow" cx="24" cy="46" rx="8" ry="4" fill="var(--leaf)" opacity="0"/>
      <ellipse id="leafR" class="grow" cx="40" cy="38" rx="8" ry="4" fill="var(--leaf)" opacity="0"/>
      <g id="bloom" class="grow" opacity="0">
        <circle cx="32" cy="10" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
        <circle cx="22" cy="17" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
        <circle cx="42" cy="17" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
        <circle cx="26" cy="28" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
        <circle cx="38" cy="28" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
        <circle cx="32" cy="20" r="6" fill="var(--center)"/>
      </g>
    </svg>
    <div>
      <div class="rank" id="rank">Seed</div>
      <div class="count" id="count">0 of 0 words</div>
    </div>
  </div>

  <div class="word" id="word" aria-live="polite"></div>
  <div class="msg" id="msg" role="status">Every word needs the yellow letter!</div>

  <div class="flower" id="flower"></div>

  <div class="actions main">
    <button class="btn" id="del">⌫ Back</button>
    <button class="btn" id="mix">🔄 Mix</button>
    <button class="btn go" id="enter">✓ Check</button>
  </div>

  <section class="panel">
    <h2>Words I found</h2>
    <div class="found" id="found"></div>
    <p class="note" id="bonusnote" hidden>Pink words are bonus words: real words that aren't on the hiding list.</p>
  </section>

  <section class="panel">
    <h2>Words still hiding</h2>
    <div class="left" id="left"></div>
    <div class="hintline" id="hintline" aria-live="polite"></div>
    <div class="actions" style="justify-content:flex-start">
      <button class="btn" id="hear">👂 Hear a word</button>
      <button class="btn" id="peek">👀 Peek a letter</button>
    </div>
  </section>

  <div class="foot">
    <span id="pnum">Flower 1</span>
    <div class="tools">
      <button class="chip" id="prev">◀ Back</button>
      <button class="chip" id="next">New flower ▶</button>
    </div>
  </div>
</div>

}catch(e){}}
// Phones only allow speech that starts from a tap, so wake the speech engine on the first touch.
function unlock(){if(unlocked||!TTS)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener('pointerdown',unlock,{once:true,capture:true});
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function load(){
  const p=P[idx];found=store.get('lf-found-'+idx,[]);bonus=store.get('lf-bonus-'+idx,[]);outer=p.o.split('');typed='';hint=null;
  $('pnum').textContent='Flower '+(idx+1)+' of '+P.length;store.set('lf-idx',idx);
  drawFlower();render();flash('Every word needs the yellow letter!');
}
function drawFlower(){
  const f=$('flower');f.innerHTML='';const p=P[idx];
  const add=(ch,x,y,cls)=>{const b=document.createElement('button');b.className=cls;b.textContent=ch;b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label','letter '+ch);b.onclick=()=>type(ch);f.appendChild(b)};
  add(p.c,50,50,'m');
  outer.forEach((ch,i)=>{const a=(i*60-90)*Math.PI/180;add(ch,50+33*Math.cos(a),50+33*Math.sin(a),'o')});
}
function render(){
  const p=P[idx];
  $('word').innerHTML=typed.split('').map(ch=>'<span'+(ch===p.c?' class="c"':'')+'>'+ch+'</span>').join('')+'<span class="caret"></span>';
  const n=found.length,t=p.w.length,fr=n/t;
  $('count').textContent=n+' of '+t+' words';
  $('rank').textContent=RANKS.filter(r=>fr>=r[0]).pop()[1];
  $('stem').setAttribute('height',Math.round(fr*52));$('stem').setAttribute('y',60-Math.round(fr*52));
  $('leafL').setAttribute('opacity',fr>=.25?1:0);$('leafR').setAttribute('opacity',fr>=.5?1:0);$('bloom').setAttribute('opacity',fr>=1?1:fr>=.75?.45:0);
  const fl=$('found');
  fl.innerHTML=(found.length||bonus.length)?'':'<span class="empty" style="background:none;cursor:default;font-size:1.05rem;font-weight:400">Tap letters to make a word.</span>';
  [...found.map(w=>[w,0]),...bonus.map(w=>[w,1])].sort((a,b)=>a[0]<b[0]?-1:1).forEach(([w,b])=>{const s=document.createElement('span');s.textContent=(b?'⭐ ':'')+w;if(b)s.className='bonus';s.title='Hear it';s.onclick=()=>say(w);fl.appendChild(s)});
  $('bonusnote').hidden=!bonus.length;
  const left={};p.w.filter(w=>!found.includes(w)).forEach(w=>left[w.length]=(left[w.length]||0)+1);
  const keys=Object.keys(left);
  $('left').innerHTML=keys.length?keys.map(k=>'<span><b>'+left[k]+'</b> with '+k+' letters</span>').join(''):'<span><b>You found them all!</b></span>';
  if(hint&&found.includes(hint.w))hint=null;
  $('hintline').textContent=hint?hint.w.split('').map((ch,i)=>i<hint.k?ch:'_').join(' '):'';
}
function flash(t,bad){$('msg').textContent=t;$('msg').className='msg'+(bad?' no':'');clearTimeout(msgT);msgT=setTimeout(()=>{$('msg').textContent=''},2600)}
function type(ch){if(typed.length<12){typed+=ch;render()}}
function back(){typed=typed.slice(0,-1);render()}
function check(){
  const p=P[idx],w=typed;if(!w)return;typed='';
  if(w.length<3)flash('Words need 3 letters or more.',1);
  else if(!w.includes(p.c))flash('Use the yellow letter!',1);
  else if(found.includes(w)||bonus.includes(w))flash('You already found '+w+'!',1);
  else if(p.b.includes(w)){bonus.push(w);store.set('lf-bonus-'+idx,bonus);flash('Bonus word! '+w);say(w)}
  else if(p.w.includes(w)){
    found.push(w);store.set('lf-found-'+idx,found);
    if(found.length===p.w.length){flash('Super Bloom! You found every word!');say(w+'! You found every word!')}
    else{const c=CHEERS[Math.random()*CHEERS.length|0];flash(c+' '+w);say(w)}
  }
  else flash('Hmm, try a different word.',1);
  render();
}
function pickHint(){const left=P[idx].w.filter(w=>!found.includes(w));if(!left.length)return null;
  if(hint&&left.includes(hint.w))return hint;return{w:left[Math.random()*left.length|0],k:1}}
$('hear').onclick=()=>{hint=pickHint();if(!hint)return;render();if(sound)say(hint.w);else flash('Turn sound on to hear it.',1)};
$('peek').onclick=()=>{const had=hint;hint=pickHint();if(!hint)return;if(had===hint&&hint.k<hint.w.length-1)hint.k++;render()};
$('del').onclick=back;$('enter').onclick=check;
$('mix').onclick=()=>{outer=shuffle(outer);drawFlower()};
$('next').onclick=()=>{idx=(idx+1)%P.length;load()};
$('prev').onclick=()=>{idx=(idx-1+P.length)%P.length;load()};
const sb=$('sound');const setSound=()=>{
  if(!TTS){sb.textContent='🔇 No voice here';sb.disabled=true;sb.title='This browser or app has no speech. Try opening the game in Safari or Chrome.';$('hear').hidden=true;return}
  sb.textContent=sound?'🔊 Sound on':'🔇 Sound off';sb.setAttribute('aria-pressed',sound)};
sb.onclick=()=>{sound=!sound;store.set('lf-sound',sound);setSound();if(sound)say('Sound on')};setSound();
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase(),p=P[idx];
  if(k==='enter'){e.preventDefault();check()}else if(k==='backspace'){e.preventDefault();back()}
  else if(k===' '){e.preventDefault();$('mix').click()}
  else if(k.length===1&&(k===p.c||p.o.includes(k)))type(k);
});
load();
</script>

</body></html>
