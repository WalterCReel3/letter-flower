<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Viewport: zoom is off (lead decision, fix-a). The game is one fixed screen for 6-7 year olds, and a
     page that cannot scroll is hard to un-zoom after an accidental pinch. touch-action:manipulation on body
     stays as well (removes double-tap zoom and the tap delay).
     interactive-widget is not set: the game has no text inputs, so the on-screen keyboard never opens. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Letter Flower</title>
<!-- PWA (task pwa). This file is variants/f-hybrid.html plus these hooks: manifest, theme colour, icons,
     self-hosted fonts and the service-worker registration at the end of <body>. All URLs are relative
     (./) because the site lives under a sub-path (GitHub Pages /letter-flower/). -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#eef6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#142227" media="(prefers-color-scheme: dark)">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<!-- FONTS: self-hosted woff2 in ./fonts/ (SIL OFL, licence texts beside them), precached by sw.js so the
     installed app looks the same offline. font-display:swap: the game shows at once in a system font and
     refits when these arrive (see refit). A change to a font file needs sw.js VERSION bumped. -->
<style>
@font-face{font-family:"Andika";font-style:normal;font-weight:400;font-display:swap;src:url("./fonts/andika-latin-400.woff2") format("woff2")}
@font-face{font-family:"Andika";font-style:normal;font-weight:700;font-display:swap;src:url("./fonts/andika-latin-700.woff2") format("woff2")}
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:600;font-display:swap;src:url("./fonts/baloo2-latin-600.woff2") format("woff2")}
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:800;font-display:swap;src:url("./fonts/baloo2-latin-800.woff2") format("woff2")}
</style>
<style>
:root{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}

/* Layout: one column garden; growing plant beside the score, the letter flower is the hero, found words below. */
:root{
  --sky:#eef6f7; --card:#ffffff; --ink:#23323a; --muted:#5d6f78;
  --petal:#ffd6e3; --petal-ink:#7a1f45; --center:#ffc93c; --center-ink:#3d2a00;
  --leaf:#3f9b5a; --leaf-soft:#d5efdc; --line:#cfe1e4; --warn:#b5452b;
  /* Fallbacks matter: offline (and on Android without Trebuchet/Comic Sans) these land on system-ui. */
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#142227; --card:#1c2e34; --ink:#eaf3f4; --muted:#a6bac0;
  --petal:#6b2a46; --petal-ink:#ffe3ee; --center:#f2b827; --center-ink:#2a1c00;
  --leaf:#6fcf8a; --leaf-soft:#20402c; --line:#2f4950; --warn:#ff9a7f; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#142227; --card:#1c2e34; --ink:#eaf3f4; --muted:#a6bac0;
  --petal:#6b2a46; --petal-ink:#ffe3ee; --center:#f2b827; --center-ink:#2a1c00;
  --leaf:#6fcf8a; --leaf-soft:#20402c; --line:#2f4950; --warn:#ff9a7f; color-scheme:dark}
/* overscroll-behavior:none stops Chrome's pull-to-refresh from reloading the game mid-word. */
html,body{background:var(--sky);color:var(--ink);overscroll-behavior:none}
/* Variant F "Hybrid" (operator's pick): A's upper half (top bar, recent chips, typed word, message, drawer menu)
   over B's lower half (big flower with Peek/Hear in its corners, B's hint row, thumb bar, Next flower).
   Built from a-tidy.html; the lower-half rules below come from b-bigflower.html.
   One fixed screen. The page itself never scrolls; only the menu panel (.scroll) may. */
html,body{height:100%;overflow:hidden}
/* No text selection, long-press callout/menu, Touch-to-Search or grey tap flash anywhere in the game. */
body{font-family:var(--read);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(3px,1dvh,10px);
  height:100vh;height:100dvh;overflow:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 6px) 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.wrap>*{flex:none}
/* Slim top bar: menu button, level name, small growing plant + count. */
.top{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:4px 10px 4px 4px}
.menu-btn{width:52px;height:52px;flex:none;border-radius:14px;border:none;background:transparent;color:var(--ink);font:800 1.7rem var(--display);cursor:pointer;touch-action:none;padding:0}
.menu-btn:focus-visible,.x:focus-visible{outline:4px solid var(--leaf);outline-offset:2px}
.lvl{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:clamp(1.25rem,6vw,1.6rem);line-height:1.05;white-space:nowrap;overflow:hidden}
/* A long name ("Level Snapdragon") is shrunk to fit by fitText(), never cut off. */
.lvl small{display:block;font-size:.95rem;color:var(--muted);font-family:var(--read);font-weight:700}
.top svg{flex:none}
.top .count{font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--ink);white-space:nowrap}
/* Recent finds: newest first, a single row; chips that would not fit are dropped, never clipped. */
.recent{display:flex;gap:6px;justify-content:center;height:38px;align-items:center;overflow:hidden;flex-wrap:nowrap}
/* Fixed row height and an explicit line-height (rev-f #4): the web Andika's taller line box can no longer grow
   the row when the first word is found, which would shrink or move the flower mid-game. */
.recent button{flex:none;font:700 1.15rem/1.2 var(--read);color:var(--ink);background:var(--leaf-soft);border:none;border-radius:12px;padding:4px 12px;height:36px;cursor:pointer;touch-action:none}
.recent button.bonus{background:var(--petal);color:var(--petal-ink)}
.recent .empty{font-size:1rem}
.recent button:focus-visible{outline:4px solid var(--leaf);outline-offset:2px}
/* From B: the status band holds the peek hint ("t _ _") or, once every word is found, the big Next flower
   button. fix-f (operator: "center the flower more... too crowded on the bottom"): it is no longer a 52px row
   above the word, which left an empty band there whenever no hint showed and pushed the flower down. It now
   overlays the top --rsv of the stage, and the flower is sized so the same --rsv stays free below it, so the
   flower is centred between the message and the bar and nothing moves when a hint or Next flower appears.
   No overflow:hidden, so Next flower's focus ring is not clipped (rev-f #7). */
.status{position:absolute;top:0;left:0;right:0;height:var(--rsv);display:flex;align-items:center;justify-content:center;pointer-events:none}
.status .hintline{font-size:1.6rem;line-height:1;letter-spacing:.15em;font-weight:700;min-height:0;white-space:nowrap;color:var(--leaf)}
.nextbig{pointer-events:auto;font:800 1.3rem var(--display);height:var(--rsv);padding:0 24px;border-radius:999px;border:3px solid var(--leaf);background:var(--leaf);color:var(--card);cursor:pointer;touch-action:none}
.nextbig:focus-visible,.helper:focus-visible{outline:4px solid var(--leaf);outline-offset:3px}
/* From B: the stage takes every pixel left over; the flower is the largest square that fits it. */
.stage{flex:1 1 0;min-height:0;position:relative;container-type:size;--rsv:48px;
  /* Flower side: capped at 300px (operator), and short enough to leave --rsv clear above (status band) and
     below (breathing room over the bar), plus 8px each side so Next flower never touches the top petal. Only a short screen (360x640) is shrunk by this. */
  --fs:min(300px,100cqw,calc(100cqh - 2 * var(--rsv) - 16px))}
/* Peek and Hear sit in the stage's bottom corners beside the lower petals, lifted 4% of the flower off its
   bottom edge (more would hit the lower side petals), near the thumbs. */
.helper{position:absolute;bottom:calc(50% - var(--fs) / 2 + var(--fs) * .04);width:max(56px,min(17cqw,17cqh,76px));aspect-ratio:1;border-radius:50%;border:3px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;touch-action:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.helper .i{font-size:1.6rem}
.helper .t{font:800 .8rem var(--display);margin-top:2px}
#peek{left:0}
#hear{right:0}
.tools{display:flex;gap:8px}
.chip{font:700 .95rem var(--read);background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;touch-action:none}
.chip[aria-pressed="false"]{color:var(--muted)}
.score{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 16px}
.score svg{flex:none}
.rank{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1}
.count{color:var(--muted);font-size:1.05rem}
.word{min-height:clamp(44px,7dvh,60px);display:flex;align-items:center;justify-content:center;font-size:clamp(2rem,6.5dvh,2.6rem);font-weight:700;letter-spacing:.06em;line-height:1;text-align:center;white-space:nowrap;overflow:hidden}
/* One line always: a 12-letter word of wide letters is shrunk by fitText(), so it is neither pushed off
   the screen edge nor wrapped (a second line would shrink the flower under the finger mid-word). */
/* Andika's ink is low in its line box: with line-height:1 the g/p/y descenders hung ~0.15em below the box
   and overflow:hidden cut them. Lifting the letters .14em centres the ink (about 0.79em up, 0.24em down)
   in the row at the same font size and row height. Its font box (1.61em) still exceeds the row, so
   #word.scrollHeight > clientHeight is expected and is not clipping; only that empty space is cut. */
.word span:not(.caret){position:relative;top:-.14em}
.word .c{color:var(--leaf)}
.word .caret{display:inline-block;width:3px;height:1em;background:var(--ink);margin-left:4px;animation:blink 1s steps(1) infinite;vertical-align:-.12em}
.word.full{animation:full .35s}
@keyframes full{25%{transform:translateX(-6px);color:var(--warn)}75%{transform:translateX(6px);color:var(--warn)}}
@keyframes blink{50%{opacity:0}}
.msg{height:1.7rem;line-height:1.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(1.05rem,5vw,1.35rem);color:var(--leaf)}
.msg.no{color:var(--warn)}
/* touch-action:none on the flower: no pan, zoom or double-tap gesture can start on the letters. */
/* Operator request: the flower is capped at 300px like the original letter-flower.html (min(300px,86vw)), so
   letters are ~93px; it is centred in the stage, which keeps the freed height above and below it. */
.flower{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--fs);aspect-ratio:1;touch-action:none;container-type:inline-size}
/* `translate` (a transform, separate from `transform`) carries the Mix move, so it never fights the centring
   translate or the :active press scale. Hit-testing follows it, so a tap mid-move types the letter under the finger. */
.flower button{position:absolute;width:31%;aspect-ratio:1;border-radius:50%;border:none;font:700 15cqw var(--read);cursor:pointer;transform:translate(-50%,-50%);transition:transform .12s,translate .32s ease-in-out;touch-action:none;padding:0 0 .12em}
/* Letter tap: one soft brightening pulse (~180ms), low contrast, no red; rate-limited to 3 a second in pulse(). */
.flower button.tap{animation:tapGlow .18s ease-out}
@keyframes tapGlow{0%{filter:brightness(1.12) saturate(1.08)}100%{filter:none}}
/* Found word: the new chip's box grows in, then its word fades in. */
.recent button.new{animation:chipIn .2s ease-out}
.recent button.new>span{animation:wordIn .15s ease-out .15s both}
@keyframes chipIn{from{transform:scale(.6)}}
@keyframes wordIn{from{opacity:0}}
.flower button.o{background:var(--petal);color:var(--petal-ink)}
.flower button.m{background:var(--center);color:var(--center-ink);box-shadow:0 0 0 6px var(--leaf-soft);z-index:1}
/* rev-f #3: the centre letter paints and hit-tests above the petals, so a petal sliding across it during Mix
   neither hides it nor takes a tap aimed at it. */
.flower button:active{transform:translate(-50%,-50%) scale(.9)}
.flower button:focus-visible,.btn:focus-visible,.chip:focus-visible,.found button:focus-visible{outline:4px solid var(--leaf);outline-offset:3px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
/* Action buttons fire on pointerup inside the button; touch-action:none so a slight slide is not taken as a scroll. */
.btn{font:800 1.2rem var(--display);border-radius:999px;padding:10px 20px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;min-width:96px;touch-action:none}
/* From B: thumb-zone bar, three big icon buttons, Check wider and green so it reads as the main one. */
.bar{display:flex;gap:10px;width:100%}
.bar .btn{flex:1 1 0;min-width:0;height:clamp(60px,10dvh,76px);padding:0 4px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bar .btn .i{font-size:1.9rem}
.bar .btn .t{font-size:.95rem;margin-top:3px}
.bar .btn.go{flex-grow:1.7}
.bar .btn.go .i{font-size:2.2rem}
.btn.go{background:var(--leaf);border-color:var(--leaf);color:var(--card)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-family:var(--display);font-size:1.15rem}
.found{display:flex;flex-wrap:wrap;gap:8px}
.found button{font:700 1.3rem var(--read);color:var(--ink);background:var(--leaf-soft);border:none;border-radius:12px;padding:4px 12px;cursor:pointer}
.found button.bonus{background:var(--petal);color:var(--petal-ink)}
/* Scrollable inner regions (menu panel, level list, a long found-word list).
   touch-action:none is set on the game buttons themselves (flower, .btn, .chip), never on a container, so a
   region opts back in to vertical scrolling just by carrying class="scroll". Buttons inside it allow pan-y:
   a swipe that starts on one scrolls the list, Chrome sends pointercancel, and onTap treats that as no tap.
   Rule for variants: never put touch-action:none on an ancestor of a .scroll region (the browser intersects
   touch-action down the tree, so it would block the scroll), and wire its buttons with onTap. */
.scroll{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.scroll button,.found button{touch-action:pan-y}
.note{font-size:.95rem;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:1.05rem}
.left{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:1.05rem}
.left b{color:var(--ink)}
.hintline{font-size:1.6rem;letter-spacing:.15em;font-weight:700;min-height:1.6em}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted)}
.grow{transition:all .5s}
/* Menu: a drawer from the left over a dim backdrop. Closed = [hidden] (display:none), so nothing in it
   can be tapped or is reported as an off-screen button; while open, #game is inert. */
/* Just after the menu closes or Next flower changes the level, the game ignores pointers for LOCK_MS (lockGame). */
.wrap.lock{pointer-events:none}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;touch-action:none}
/* Narrower than the screen by at least ~58px, so the backdrop strip on the right is a real tap target. */
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(340px,84vw);z-index:11;background:var(--sky);
  border-right:2px solid var(--line);display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.25);
  padding-top:env(safe-area-inset-top,0px);animation:fadein .15s ease-out}
/* Fade, not slide: a moving button would drop a quick tap (onTap's slop is measured against its rect). */
@keyframes fadein{from{opacity:0}}
.drawer-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 16px;border-bottom:2px solid var(--line)}
.drawer-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.6rem}
.x{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--card);color:var(--ink);font:800 1.4rem var(--display);cursor:pointer;touch-action:none;padding:0}
.drawer-body{flex:1;min-height:0;overflow-x:hidden;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:14px}
.drawer-body .panel{padding:12px 14px}
.toggles{display:flex;flex-direction:column;gap:8px}
.toggles .chip{text-align:left;font-size:1.1rem;min-height:48px;padding:8px 16px}
/* One column on a phone: "🌱 Snapdragon 0/13" needs ~186px, so two columns overflowed the drawer sideways
   (the right column was clipped). Two columns only where both fit. */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.levels button{font:700 1.05rem var(--read);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;min-height:52px;padding:6px 10px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.levels button .n{color:var(--muted);font-size:.95rem;white-space:nowrap}
.levels button.done{background:var(--leaf-soft)}
.levels button[aria-current="true"]{border-color:var(--leaf);border-width:3px;box-shadow:0 0 0 2px var(--leaf-soft)}
.levels button:focus-visible,.toggles .chip:focus-visible{outline:4px solid var(--leaf);outline-offset:2px}
.steps{display:flex;gap:8px}
.steps .chip{flex:1;min-height:48px}
.how{margin:0;padding-left:1.3em;font-size:1.1rem;line-height:1.45}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
@media (prefers-reduced-motion:reduce){.grow,.flower button{transition:none}.word .caret{animation:none}.word.full{animation:none}
  .flower button:active{transform:translate(-50%,-50%)}}   /* rev-f #5: no press scale either */
/* Reduced motion: no movement or scaling (Mix jumps, see mix()); chips and taps keep only a plain opacity change. */
@media (prefers-reduced-motion:reduce){
  .recent button.new{animation:fadeIn .2s ease-out}.recent button.new>span{animation:none}
  .flower button.tap{animation:tapFade .18s ease-out}}
@keyframes fadeIn{from{opacity:0}}
@keyframes tapFade{0%{opacity:.85}100%{opacity:1}}
</style>
</head>
<body>

<div class="wrap" id="game">
  <div class="top">
    <button class="menu-btn" id="menu" aria-label="Menu" aria-haspopup="dialog" aria-expanded="false" aria-controls="drawer">☰</button>
    <div class="lvl"><span id="pnum">Level Daisy</span><small id="rank">Seed</small></div>
    <svg id="plant" width="38" height="43" viewBox="0 0 64 72" aria-hidden="true">
      <rect x="10" y="60" width="44" height="12" rx="4" fill="var(--warn)" opacity=".75"/>
      <rect id="stem" class="grow" x="30" y="60" width="4" height="0" rx="2" fill="var(--leaf)"/>
      <ellipse id="leafL" class="grow" cx="24" cy="46" rx="8" ry="4" fill="var(--leaf)" opacity="0"/>
      <ellipse id="leafR" class="grow" cx="40" cy="38" rx="8" ry="4" fill="var(--leaf)" opacity="0"/>
      <g id="bloom" class="grow" opacity="0">
        <circle cx="32" cy="10" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
        <circle cx="22" cy="17" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
        <circle cx="42" cy="17" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
        <circle cx="26" cy="28" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
        <circle cx="38" cy="28" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
        <circle cx="32" cy="20" r="6" fill="var(--center)"/>
      </g>
    </svg>
    <div class="count" id="count" aria-label="0 of 0 words">0/0</div>
  </div>

  <div class="recent" id="recent" aria-label="Words you just found"></div>

  <!-- Lower half from B: hint row (or Next flower) above the word, big flower, Peek/Hear corners, thumb bar. -->
  <div class="word" id="word" aria-live="polite"></div>
  <div class="msg" id="msg" role="status">Every word needs the yellow letter!</div>

  <div class="stage">
    <div class="status">
      <div class="hintline" id="hintline" aria-live="polite"></div>
      <button class="nextbig" id="nextbig" hidden>Next flower ▶</button>
    </div>
    <div class="flower" id="flower"></div>
    <button class="helper" id="peek" aria-label="Peek a letter"><span class="i" aria-hidden="true">👀</span><span class="t">Peek</span></button>
    <button class="helper" id="hear" aria-label="Hear a word"><span class="i" aria-hidden="true">👂</span><span class="t">Hear</span></button>
  </div>

  <div class="bar">
    <button class="btn" id="del" aria-label="Back"><span class="i" aria-hidden="true">⌫</span><span class="t">Back</span></button>
    <button class="btn" id="mix" aria-label="Mix"><span class="i" aria-hidden="true">🔄</span><span class="t">Mix</span></button>
    <button class="btn go" id="enter" aria-label="Check"><span class="i" aria-hidden="true">✓</span><span class="t">Check</span></button>
  </div>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <h2 id="drawer-title">🌼 Letter Flower</h2>
    <button class="x" id="close" aria-label="Close menu">✕</button>
  </div>
  <div class="drawer-body scroll" id="drawer-body">
    <div class="toggles">
      <button class="chip" id="sound" aria-pressed="true">🔊 Sound on</button>
      <button class="chip" id="shuffle" aria-pressed="false">🔀 Mix up the flowers: off</button>
    </div>

    <section class="panel">
      <h2>Words I found</h2>

// second finger never blocks or doubles a tap. The click that a pointer contact produces (however long the

// The swallow window is measured from the pointerup, not the pointerdown: the browser dispatches a pointer's
// click right after its pointerup however long the press lasted. A contact that never produces a click
// (long-press, drag-off) therefore leaves nothing behind that could eat a later screen-reader click.
const CLICK_AFTER_UP_MS = 800;

  el.addEventListener('pointerup', e => { if (!(e.pointerType === 'mouse' && e.button !== 0)) upAt = performance.now(); });

    if (performance.now() - upAt < CLICK_AFTER_UP_MS) { upAt = -Infinity; return; }
    if (!el.disabled) fn();
  });

// .scroll region) means no tap.
const TAP_SLOP = 16, TAP_MAX_MS = 1500;

  let downId = null, downAt = 0;

  el.addEventListener('lostpointercapture', drop);

}
