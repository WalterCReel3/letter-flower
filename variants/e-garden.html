<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Viewport: maximum-scale=1 + user-scalable=no (lead decision, fix-e): an accidental pinch-zoom on a
     fixed one-screen game is hard for a child to undo. touch-action:manipulation stays as well (tap delay,
     double-tap zoom). interactive-widget is not set: the game has no text inputs, so no keyboard opens. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Letter Flower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}

/* Layout: Garden Path variant, see the block below. */
:root{
  --sky:#eef6f7; --card:#ffffff; --ink:#23323a; --muted:#5d6f78;
  --petal:#ffd6e3; --petal-ink:#7a1f45; --center:#ffc93c; --center-ink:#3d2a00;
  --leaf:#3f9b5a; --leaf-soft:#d5efdc; --line:#cfe1e4; --warn:#b5452b;
  /* Fallbacks matter: offline (and on Android without Trebuchet/Comic Sans) these land on system-ui. */
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#142227; --card:#1c2e34; --ink:#eaf3f4; --muted:#a6bac0;
  --petal:#6b2a46; --petal-ink:#ffe3ee; --center:#f2b827; --center-ink:#2a1c00;
  --leaf:#6fcf8a; --leaf-soft:#20402c; --line:#2f4950; --warn:#ff9a7f; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#142227; --card:#1c2e34; --ink:#eaf3f4; --muted:#a6bac0;
  --petal:#6b2a46; --petal-ink:#ffe3ee; --center:#f2b827; --center-ink:#2a1c00;
  --leaf:#6fcf8a; --leaf-soft:#20402c; --line:#2f4950; --warn:#ff9a7f; color-scheme:dark}
/* overscroll-behavior:none stops Chrome's pull-to-refresh from reloading the game mid-word. */
html,body{background:var(--sky);color:var(--ink);overscroll-behavior:none}
/* No text selection, long-press callout/menu, Touch-to-Search or grey tap flash anywhere in the game. */
body{font-family:var(--read);padding-inline:16px;padding-block:12px 28px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* ===== Variant E "Garden Path" =====
   One fixed portrait screen (100dvh flex column, nothing scrolls but the path strip sideways and the menu
   panel up/down). Top bar: menu, "Level Daisy", plant + count, recent words. Under it the garden path:
   one small flower per level in Game.order(), current one ringed, finished ones bloomed. Then the word
   card with Peek / Hear beside the word, the letter flower (sized to whatever height is left), Back/Mix/Check. */
html,body{height:100%;overflow:hidden}
body{padding:0}
.wrap{box-sizing:border-box;height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px;
  padding:max(8px,env(safe-area-inset-top,0px)) 12px max(10px,env(safe-area-inset-bottom,0px));overflow:hidden}
/* Top bar */
.top{flex:none;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px}
.iconbtn{width:48px;height:48px;padding:0;display:grid;place-items:center;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;touch-action:none}
.iconbtn svg{width:26px;height:26px}
#pnum{font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,5.2vw,1.6rem);line-height:1.05;margin:0;overflow-wrap:normal;min-width:0}
.score{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:2px 10px 2px 4px}
.score svg{flex:none;width:36px;height:40px}
.rank{font-family:var(--display);font-weight:800;font-size:1rem;line-height:1.1}
.count{color:var(--muted);font-size:.9rem;line-height:1.1;white-space:nowrap}
.recent{flex:none;display:flex;justify-content:flex-end;justify-content:safe flex-end;align-items:center;gap:6px;height:26px;overflow:hidden;white-space:nowrap}
.recent span{font:700 1rem var(--read);background:var(--leaf-soft);color:var(--ink);border-radius:10px;padding:1px 9px;line-height:1.4}
.recent span.bonus{background:var(--petal);color:var(--petal-ink)}
.recent span.old{opacity:.7}
.recent .empty{background:none;color:var(--muted);font-weight:400}
/* Garden path: scrolls sideways inside itself only. pan-x + overscroll-behavior-x:contain keep a swipe here
   from panning the page or turning into Chrome's back/forward swipe; it is inset from the screen edges so a
   swipe on it does not start in Android's edge back-gesture zone. */
.path{flex:none;display:flex;gap:2px;align-items:center;margin:0 12px;padding:3px 6px;overflow-x:auto;overflow-y:hidden;
  overscroll-behavior:contain;touch-action:pan-x;scrollbar-width:none;border-radius:28px;
  background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 18px) center/100% 4px no-repeat,var(--card);
  border:2px solid var(--line)}
.path::-webkit-scrollbar{display:none}
.path button{flex:none;width:48px;height:48px;padding:0;border-radius:50%;border:3px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;touch-action:pan-x}
.path button svg{width:36px;height:36px;pointer-events:none}
.path button[aria-current="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.path button:focus-visible,.iconbtn:focus-visible,.lvl:focus-visible{outline:4px solid var(--leaf);outline-offset:2px}
/* Word card: Peek | word + hint blanks | Hear */
.wordcard{flex:none;display:grid;grid-template-columns:70px minmax(0,1fr) 70px;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:5px}
.btn.hint{min-width:0;height:64px;padding:2px;border-radius:16px;border-width:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:1rem;line-height:1.1}
.btn.hint .ic{font-size:1.5rem;line-height:1.1}
.mid{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:64px}
.word{min-height:0;height:40px;font-size:2.2rem;line-height:1;letter-spacing:.04em;white-space:nowrap;overflow:hidden;max-width:100%}
.word .c{color:var(--leaf)}
.word .caret{display:inline-block;width:3px;height:1em;background:var(--ink);margin-left:3px;animation:blink 1s steps(1) infinite;vertical-align:-.12em}
.word.full{animation:full .35s}
@keyframes full{25%{transform:translateX(-6px);color:var(--warn)}75%{transform:translateX(6px);color:var(--warn)}}
@keyframes blink{50%{opacity:0}}
.hintline{font-size:1.3rem;letter-spacing:.12em;font-weight:700;height:24px;line-height:24px;min-height:0;color:var(--petal-ink);white-space:nowrap;overflow:hidden;max-width:100%}
.msg{flex:none;height:2.4em;line-height:1.2;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-weight:800;font-size:1.1rem;color:var(--leaf);overflow:hidden}
.msg.no{color:var(--warn)}
/* The flower takes whatever height is left (container query units), letters stay >= 64px down to 360x640. */
.stage{flex:1 1 0;min-height:0;container-type:size;display:grid;place-items:center}
.flower{position:relative;width:min(330px,100cqw,100cqh);aspect-ratio:1;margin:0 auto;touch-action:none}
.flower button{position:absolute;width:31%;aspect-ratio:1;border-radius:50%;border:none;font:700 clamp(2rem,10vw,2.8rem) var(--read);cursor:pointer;transform:translate(-50%,-50%);transition:transform .12s;touch-action:none;padding:0 0 .12em}
.flower button.o{background:var(--petal);color:var(--petal-ink)}
.flower button.m{background:var(--center);color:var(--center-ink);box-shadow:0 0 0 6px var(--leaf-soft)}
.flower button:active{transform:translate(-50%,-50%) scale(.9)}
.flower button:focus-visible,.btn:focus-visible,.chip:focus-visible,.found button:focus-visible{outline:4px solid var(--leaf);outline-offset:3px}
/* Action buttons fire on pointerup inside the button; touch-action:none so a slight slide is not taken as a scroll. */
.btn{font:800 1.2rem var(--display);border-radius:999px;padding:10px 20px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;min-width:96px;touch-action:none}
.actions{display:flex;gap:8px}
.actions.main{flex:none;flex-wrap:nowrap;max-width:360px;margin:0 auto;width:100%}
.actions.main .btn{flex:1 1 0;min-width:0;min-height:54px;padding:8px 6px;font-size:1.1rem;white-space:nowrap}
.btn.go{background:var(--leaf);border-color:var(--leaf);color:var(--card)}
/* Menu drawer. Closed = [hidden] (display:none), so nothing in it can be tapped or reached; while open the
   game behind it is inert. Only .drawer-body scrolls (class="scroll", see core's rule). */
.menu{position:fixed;inset:0;z-index:10}
.backdrop{position:absolute;inset:0;background:rgba(10,25,30,.45);touch-action:none}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(360px,90vw);background:var(--sky);display:flex;flex-direction:column;
  box-shadow:4px 0 24px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:fadein .15s ease-out}
/* A fade, not a slide: nothing moves under a finger while it runs, so a tap during it lands where it looks. */
@keyframes fadein{from{opacity:0}to{opacity:1}}
.drawer-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.drawer-head h2{margin:0;font-family:var(--display);font-size:1.5rem}
.drawer-body{flex:1 1 0;min-height:0;padding:0 12px 16px;display:flex;flex-direction:column;gap:12px}
.panel{flex:none;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-family:var(--display);font-size:1.2rem}
.toggle{width:100%;min-height:52px;text-align:left;font-size:1.1rem;border-width:2px;border-color:var(--line)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toggle::after{content:"Off";flex:none;font-size:.95rem;padding:2px 10px;border-radius:999px;background:var(--line);color:var(--ink)}
.toggle[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.toggle[aria-pressed="true"]::after{content:"On";background:var(--leaf);color:var(--card)}
#sound.toggle::after{content:none}
.found{display:flex;flex-wrap:wrap;gap:8px}
.found button{font:700 1.3rem var(--read);color:var(--ink);background:var(--leaf-soft);border:none;border-radius:12px;padding:6px 12px;min-height:44px;cursor:pointer}
.found button.bonus{background:var(--petal);color:var(--petal-ink)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lvl{display:flex;align-items:center;gap:4px;min-height:52px;padding:4px 6px 4px 2px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 .95rem var(--read);text-align:left;cursor:pointer;min-width:0}
.lvl svg{flex:none;width:28px;height:28px}
.lvl span{min-width:0;overflow-wrap:normal;line-height:1.1}
.lvl small{display:block;color:var(--muted);font-weight:400}
.lvl[aria-current="true"]{border-color:var(--leaf);border-width:3px;background:var(--leaf-soft)}
.how{margin:0;padding-left:1.2em;font-size:1.1rem;line-height:1.5}
.navrow{display:flex;gap:8px}
.navrow .btn{flex:1 1 0;min-width:0;min-height:52px;padding:6px;font-size:1.05rem;border-width:2px}
/* Scrollable inner regions: see core. Buttons inside allow pan-y so a swipe that starts on one scrolls. */
.scroll{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.scroll button,.found button{touch-action:pan-y}
.note{font-size:.95rem;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:1.05rem}
.left{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:1.05rem}
.left b{color:var(--ink)}
.grow{transition:all .5s}
@media (prefers-reduced-motion:reduce){.grow,.flower button{transition:none}.word .caret{animation:none}.word.full{animation:none}.drawer{animation:none}}
</style>
</head>
<body>

<div class="wrap" id="game">
  <div class="top">
    <button class="iconbtn" id="menubtn" aria-label="Menu" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>
    </button>
    <h1 id="pnum">Level Daisy</h1>
    <div class="score">
      <svg id="plant" width="64" height="72" viewBox="0 0 64 72" aria-hidden="true">
        <rect x="10" y="60" width="44" height="12" rx="4" fill="var(--warn)" opacity=".75"/>
        <rect id="stem" class="grow" x="30" y="60" width="4" height="0" rx="2" fill="var(--leaf)"/>
        <ellipse id="leafL" class="grow" cx="24" cy="46" rx="8" ry="4" fill="var(--leaf)" opacity="0"/>
        <ellipse id="leafR" class="grow" cx="40" cy="38" rx="8" ry="4" fill="var(--leaf)" opacity="0"/>
        <g id="bloom" class="grow" opacity="0">
          <circle cx="32" cy="10" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
          <circle cx="22" cy="17" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
          <circle cx="42" cy="17" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
          <circle cx="26" cy="28" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
          <circle cx="38" cy="28" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
          <circle cx="32" cy="20" r="6" fill="var(--center)"/>
        </g>
      </svg>
      <div>
        <div class="rank" id="rank">Seed</div>
        <div class="count" id="count">0 of 0</div>
      </div>
    </div>
  </div>
  <div class="recent" id="recent" aria-label="New words"></div>

  <nav class="path" id="path" aria-label="Flowers"></nav>

  <div class="wordcard">
    <button class="btn hint" id="peek" aria-label="Peek a letter"><span class="ic" aria-hidden="true">👀</span>Peek</button>
    <div class="mid">
      <div class="word" id="word" aria-live="polite"></div>
      <div class="hintline" id="hintline" aria-live="polite"></div>
    </div>
    <button class="btn hint" id="hear" aria-label="Hear a word"><span class="ic" aria-hidden="true">👂</span>Hear</button>
  </div>
  <div class="msg" id="msg" role="status">Every word needs the yellow letter!</div>

  <div class="stage"><div class="flower" id="flower"></div></div>

  <div class="actions main">
    <button class="btn" id="del">⌫ Back</button>
    <button class="btn" id="mix">🔄 Mix</button>
    <button class="btn go" id="enter">✓ Check</button>
  </div>
</div>

<div class="menu" id="menu" hidden>
  <div class="backdrop" id="backdrop"></div>
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="menutitle">
    <div class="drawer-head">
      <h2 id="menutitle">Menu</h2>
      <button class="iconbtn" id="close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body scroll" id="drawerbody">
      <section class="panel">
        <h3>Words I found</h3>
        <div class="found" id="found"></div>
        <p class="note" id="bonusnote" hidden>⭐ Pink words are bonus words.</p>
        <div class="left" id="left"></div>
      </section>
      <section class="panel">
        <button class="btn toggle" id="sound" aria-pressed="true">🔊 Sound on</button>
        <button class="btn toggle" id="shuf" aria-pressed="false">🔀 Mix up the flowers</button>
      </section>
      <section class="panel">
        <h3>Flowers</h3>
        <div class="navrow">
          <button class="btn" id="prev">◀ Last</button>
          <button class="btn go" id="next">Next ▶</button>
        </div>
        <div class="levels" id="levels"></div>
      </section>
      <section class="panel">
        <h3>How to play</h3>
        <ol class="how">
          <li>Tap letters to make a word.</li>
          <li>Use the yellow letter in every word.</li>
          <li>Tap ✓ Check.</li>
          <li>Stuck? Tap 👀 Peek or 👂 Hear.</li>
        </ol>
      </section>
    </div>
  </div>
</div>

<script>
/*
 * Levels. Each puzzle: id (permanent save key), name (shown as "Level <name>"),
 * c = center letter (in every word), o = the six petal letters, w = target words, b = bonus words.
 *
 * Order is baked, not computed at runtime, so it is the same on every device and reload.
 * It was produced ONCE from the original letter-flower.html P array (original puzzles 1..30) by a
 * Fisher-Yates shuffle (for i = n-1 down to 1: j = floor(rand() * (i+1)); swap i, j) driven by
 * mulberry32 with seed 20261017; names were then assigned in list order (Daisy, Tulip, Rose, ...).
 * Bonus lists had these non-kid entries removed: bafta brit goa otto orc parr tor playa hath thee
 * thine ken roc ted mon monte conte carte chino newton. Target (w) words were not touched.
 */
const P=[
  {"id":"daisy","name":"Daisy","c":"i","o":"begprt","w":["bib","big","bit","bite","pie","pig","pit","tie","tiger","tip","trip"],"b":["beige","bigger","bitter","bribe","brig","eerie","gig","grip","grit","ire","petit","petite","pier","pip","pipe","piper","retire","rib","rig","rip","ripe","ripper","rite","terrier","tier","tire","tribe","trigger"]},
  {"id":"tulip","name":"Tulip","c":"n","o":"deiopw","w":["down","end","need","new","nine","noon","now","one","open","own","pen","pin","pine","pond","win","wind"],"b":["deepen","den","depend","din","dine","don","done","indeed","inn","iodine","ion","nip","nod","node","non","none","nope","onion","opinion","widen","window","wine","won","wooden"]},
  {"id":"rose","name":"Rose","c":"p","o":"acirtu","w":["cap","cup","part","pat","pit","pup","put","rap","tap","tip","trap","trip"],"b":["apart","apt","carp","pact","pair","pap","papa","par","para","pic","pip","pita","putt","rip"]},
  {"id":"sunflower","name":"Sunflower","c":"a","o":"bdoprt","w":["add","art","bad","bar","bat","boat","dad","oat","pad","part","pat","rap","rat","road","tap","tar","toad","trap"],"b":["abbot","aboard","abort","abroad","adapt","ado","adopt","apart","apt","arbor","atop","baba","barb","bard","boa","boar","board","brad","brat","broad","dab","dart","data","dorado","drab","pap","papa","par","para","parrot","potato","radar","rapport","raptor","roar","tab","taboo","tarot","tart","tat","tattoo"]},
  {"id":"lily","name":"Lily","c":"l","o":"abempy","w":["all","apple","ball","bell","lamb","lamp","lap","meal","play","yell"],"b":["able","ale","alley","ally","alma","ample","appeal","apply","bale","balm","belle","belly","blame","eel","elm","emblem","eyeball","lab","label","lama","lame","lay","leap","lee","male","mall","mammal","maple","melee","pal","pale","palm","palpable","papal","payable","pebble","peel","plea","ply","yelp"]},
  {"id":"poppy","name":"Poppy","c":"d","o":"aegorw","w":["add","dad","dear","deer","dog","draw","good","odd","red","road","weed","wood","word"],"b":["added","ado","adore","aged","award","dagger","dare","dead","dee","deed","degrade","degraded","degree","dew","dodge","dodger","doe","door","dorado","drag","drawer","dread","dredge","drew","edge","edged","erode","eroded","grade","graded","grader","greed","ode","odor","order","ordered","radar","ragged","read","reader","redwood","reed","regard","reread","reward","rod","rode","rodeo","wade","ward","wed","wedge","wooded"]},
  {"id":"violet","name":"Violet","c":"p","o":"ahilot","w":["hop","lap","lip","loop","pat","pit","pool","pop","pot","tap","tip","top"],"b":["alpha","apt","atop","hap","hilltop","hip","hippo","hoop","lollipop","opal","pal","pap","papa","papal","path","patio","photo","pill","pilot","pip","pita","plot","poll","polo","pooh","potato"]},
  {"id":"pansy","name":"Pansy","c":"t","o":"abegnu","w":["ant","ate","bat","bet","but","eat","gate","get","neat","net","nut","tag","tan","ten","tent","tub","tug","tuna"],"b":["agent","ante","antenna","aunt","beat","beaten","beet","bent","beta","butt","butte","eaten","gut","nugget","tab","tang","tangent","tat","tea","tee","teen","teenage","tenant","tenet","tube","tune","unbeaten"]},

  } catch (e) {}
}

/* ---------- Input ---------- */
// Letters fire on pointerdown: one contact = one letter, immediately, per pointer, so a resting palm or a
// second finger never blocks or doubles a tap. The click that a pointer contact produces (however long the
// press was) is swallowed; a click with no pointer contact before it (keyboard Enter/Space, screen reader
// activation) still types the letter.
// The swallow window is measured from the pointerup, not the pointerdown: the browser dispatches a pointer's
// click right after its pointerup however long the press lasted. A contact that never produces a click
// (long-press, drag-off) therefore leaves nothing behind that could eat a later screen-reader click.
const CLICK_AFTER_UP_MS = 800;
function swallowClickAfterPointer(el, fn) {
  let upAt = -Infinity;  // when the last primary pointer contact on el ended
  el.addEventListener('pointerup', e => { if (!(e.pointerType === 'mouse' && e.button !== 0)) upAt = performance.now(); });
  el.addEventListener('keydown', () => { upAt = -Infinity; });
  el.addEventListener('click', () => {
    if (performance.now() - upAt < CLICK_AFTER_UP_MS) { upAt = -Infinity; return; }
    if (!el.disabled) fn();
  });
}
function onPress(el, fn) {
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    fn();
  });
  swallowClickAfterPointer(el, fn);
}
// Action buttons fire on pointerup inside the button (plus a little slop), not pointerdown: a child resting
// a finger on Check while reaching for letters must not submit, and a finger that slides off can take it
// back. touch-action:none on these buttons means a slight slide is not turned into a scroll (which would
// cancel the pointer and, with plain 'click', silently drop the tap).
// A contact held longer than TAP_MAX_MS is not a tap (a palm resting on Check must not submit when it lifts);
// 1.5 s rather than shorter so a slow, deliberate press by a 6-year-old still counts.
// The pointer is captured on pointerdown, so its pointerup always comes back here and downId cannot go stale
// (a mouse released elsewhere used to leave it set). pointercancel (e.g. the finger started a scroll in a
// .scroll region) means no tap.
const TAP_SLOP = 16, TAP_MAX_MS = 1500;
function onTap(el, fn) {
  let downId = null, downAt = 0;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    downId = e.pointerId; downAt = performance.now();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  el.addEventListener('pointerup', e => {
    if (e.pointerId !== downId) return;
    downId = null;
    if (performance.now() - downAt > TAP_MAX_MS) return;
    const r = el.getBoundingClientRect();
    if (e.clientX >= r.left - TAP_SLOP && e.clientX <= r.right + TAP_SLOP &&
        e.clientY >= r.top - TAP_SLOP && e.clientY <= r.bottom + TAP_SLOP && !el.disabled) fn();
  });
  const drop = e => { if (e.pointerId === downId) downId = null; };
  el.addEventListener('pointercancel', drop);
  el.addEventListener('lostpointercapture', drop);
  swallowClickAfterPointer(el, fn);
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

const listeners = [];
let foundKey = null, notifying = false;
function readSaved() {
  const p = P[idx];

  bonus = clean(store.get('lf2-bonus-' + p.id, []), p.b);
}
// Two tabs (or two variants) can be open on the same level. Saving re-reads the stored list and writes the
// union with this tab's list, so a stale tab adds to what another tab found instead of overwriting it.
function saveWord(kind, list, allowed, w) {
  const key = 'lf2-' + kind + '-' + P[idx].id;
  const merged = clean([...clean(store.get(key, []), allowed), ...list, w], allowed);
  store.set(key, merged);
  return merged;
}
// Another tab changed this level's words (or index.html reset them): take the stored lists as they are now.
// Replacing rather than merging is what lets a reset stick in a tab that is still open.
window.addEventListener('storage', e => {
  const id = P[idx].id;
  if (e.key === null || e.key === 'lf2-found-' + id || e.key === 'lf2-bonus-' + id) { readSaved(); recent = recent.filter(w => found.includes(w) || bonus.includes(w)); if (!recent.length) seedRecent(); render(); }
});
function load() {

}
function drawFlower() {
  const f = $('flower'); f.innerHTML = ''; const p = P[idx];
  const add = (ch, x, y, cls) => {
    const b = document.createElement('button');
    b.className = cls; b.textContent = ch; b.style.left = x + '%'; b.style.top = y + '%';
    b.setAttribute('aria-label', 'letter ' + ch);
    onPress(b, () => type(ch));
    f.appendChild(b);
  };
  add(p.c, 50, 50, 'm');

}
function render() {
  const p = P[idx];
  $('word').innerHTML = typed.split('').map(ch => '<span' + (ch === p.c ? ' class="c"' : '') + '>' + ch + '</span>').join('') + '<span class="caret"></span>';
  fitWord();
  const n = found.length, t = p.w.length, fr = n / t;
  $('count').textContent = n + ' of ' + t;
  const rk = RANKS.filter(r => fr >= r[0]).pop()[1];
  if ($('rank').textContent !== rk) { $('rank').textContent = rk; fitTitle(); }  // the rank column's width moves the title's

  $('leafL').setAttribute('opacity', fr >= .25 ? 1 : 0); $('leafR').setAttribute('opacity', fr >= .5 ? 1 : 0);
  $('bloom').setAttribute('opacity', fr >= 1 ? 1 : fr >= .75 ? .45 : 0);

  // drop a finger that is resting on a chip, and it is ~90 buttons on the biggest levels.
  const key = found.join() + '|' + bonus.join();

    foundKey = key;
    const fl = $('found');
    fl.innerHTML = (found.length || bonus.length) ? '' : '<span class="empty">Tap letters to make a word.</span>';
    [...found.map(w => [w, 0]), ...bonus.map(w => [w, 1])].sort((a, b) => a[0] < b[0] ? -1 : 1).forEach(([w, isBonus]) => {
      const s = document.createElement('button');

  const keys = Object.keys(left);
  $('left').innerHTML = keys.length ? keys.map(k => '<span><b>' + left[k] + '</b> with ' + k + ' letters</span>').join('') : '<span><b>You found them all!</b></span>';
  if (hint && found.includes(hint.w)) hint = null;

function type(ch) {

    const w = $('word'); w.classList.remove('full'); void w.offsetWidth; w.classList.add('full');
    clearTimeout(fullT); fullT = setTimeout(() => w.classList.remove('full'), 400);
    flash('That is the most letters! Tap Check or Back.', 1);

}

  else if (!w.includes(p.c)) flash('Use the yellow letter!', 1);
  else if (found.includes(w) || bonus.includes(w)) flash('You already found ' + w + '!', 1);

}
function hear() { hint = pickHint(); if (!hint) return; render(); if (sound) say(hint.w); else flash('Turn sound on to hear it.', 1); }
function peek() { const had = hint; hint = pickHint(); if (!hint) return; if (had === hint && hint.k < hint.w.length - 1) hint.k++; render(); }
function mix() { outer = shuffle(outer); drawFlower(); }
function goIndex(i) { idx = i; load(); }
// Next/prev follow the current order (baked, or this startup's shuffle), wrapping at the ends.
function step(d) { const n = order.length; goIndex(order[(order.indexOf(idx) + d + n) % n]); }
function setShuffle(on) {
  shuffleOn = !!on; store.set('lf2-shuffle', shuffleOn);
  order = makeOrder();   // stays on the current level; only what comes next changes
  render();
}

onTap($('hear'), hear);
onTap($('peek'), peek);
onTap($('del'), back);
onTap($('enter'), check);
onTap($('mix'), mix);
onTap($('next'), () => step(1));
onTap($('prev'), () => step(-1));

const sb = $('sound');
function setSound() {
  if (!TTS) { sb.textContent = '🔇 No voice here'; sb.disabled = true; sb.title = 'This browser or app has no speech. Try opening the game in Safari or Chrome.'; $('hear').hidden = true; return; }
  sb.textContent = sound ? '🔊 Sound on' : '🔇 Sound off'; sb.setAttribute('aria-pressed', sound);
}
onTap(sb, () => { sound = !sound; store.set('lf2-sound', sound); setSound(); if (sound) say('Sound on'); });
setSound();

// Physical keyboard. Enter/Space on a button the player reached with Tab activate that button natively;
// otherwise Enter = Check, Space = Mix, Backspace = Back, letters type. (Not :focus-visible: Chrome turns
// that on for a mouse-focused button as soon as any key is typed, which would make Enter add a letter.)
let tabFocused = null, lastInputKey = false;
document.addEventListener('pointerdown', () => { lastInputKey = false; tabFocused = null; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Tab') lastInputKey = true; }, true);
document.addEventListener('focusin', e => { tabFocused = lastInputKey ? e.target : null; });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (menuOpen) { if (e.key === 'Escape') { e.preventDefault(); closeMenu(); } return; }
  const k = e.key.toLowerCase(), p = P[idx], t = e.target;
  if ((k === 'enter' || k === ' ') && t && t.tagName === 'BUTTON' && t === tabFocused) return;
  if (k === 'enter') { e.preventDefault(); check(); }
  else if (k === 'backspace') { e.preventDefault(); back(); }
  else if (k === ' ') { e.preventDefault(); mix(); }
  else if (k.length === 1 && (k === p.c || p.o.includes(k))) { if (!e.repeat) type(k); }
});

/* ---------- API for layout variants ---------- */
// levels: every level in the baked order (fixed). order(): ids in the order play currently follows.
// state().index is the position of the current level in order() (equal to its baked index when shuffle is off).
// onChange(fn) is called after every render; a listener may call goTo/setShuffle, see the guard in render().
window.Game = {
  levels: P.map(p => ({ id: p.id, name: p.name })),
  goTo(id) { const i = indexOf(id); if (i < 0) return false; goIndex(i); return true; },
  state() {
    const p = P[idx];
    return { id: p.id, name: p.name, index: order.indexOf(idx), typed, found: found.slice(), bonus: bonus.slice(), total: p.w.length, done: found.length === p.w.length };
  },
  // Progress for any level without switching to it (for a level picker).
  progress(id) { const p = P[indexOf(id)]; if (!p) return null; return { found: clean(store.get('lf2-found-' + p.id, []), p.w).length, total: p.w.length }; },
  onChange(fn) { listeners.push(fn); },
  get shuffle() { return shuffleOn; },
  setShuffle,
  order() { return order.map(i => P[i].id); }
};

/* ---------- Garden Path UI (variant E) ---------- */
// Every button here is wired with onTap (actions) like core's, never onclick.
// Ghost-click guard. A touch tap ends with a click that the browser sends to whatever is under the finger
// AFTER our pointerup handler ran. When that handler swapped the screen (menu opened or closed, level
// changed and the path re-centred), the click lands on the new element: opening the menu would hit the
// backdrop and close it again, closing it over Check would submit the word. onTap/onPress act on pointer
// events and only use click for keyboard/screen-reader activation, so dropping clicks for a moment after
// such a swap loses nothing a finger did.
const GHOST_MS = 600;
// Post-swap lockout. A child's double-tap is two real contacts: tap 1 closes the menu or changes the level,
// and tap 2's pointerdown would then land on whatever is now under the finger (a letter, another flower on
// the re-centred path). For LOCK_MS after a swap, pointerdown inside #game is dropped before any handler
// sees it (capture on window runs first), so it neither types nor starts an onTap. Only a swap made by a
// finger or mouse (inside a pointerup) starts it; Game.goTo() from a script or a key does not.
const LOCK_MS = 300;
let ghostUntil = 0, lockUntil = 0, lastUpAt = -Infinity;
window.addEventListener('pointerup', () => { lastUpAt = performance.now(); }, true);
const guardGhost = () => { const t = performance.now(); ghostUntil = t + GHOST_MS; if (t - lastUpAt < 100) lockUntil = t + LOCK_MS; };
document.addEventListener('click', e => { if (performance.now() < ghostUntil) { e.preventDefault(); e.stopPropagation(); } }, true);
window.addEventListener('pointerdown', e => {
  if (performance.now() < lockUntil && $('game').contains(e.target)) { e.preventDefault(); e.stopImmediatePropagation(); }
}, true);
// A tap that only stops a fling is not a pick. Chrome sends pointerdown/up (but no click) for the finger
// that halts a scrolling strip or list, and onTap acts on pointerup, so without this the flower or level
// that happened to be under the finger would be chosen. Not a pick if the region scrolled within
// FLING_MS before the pointerdown, or between pointerdown and pointerup. A scroll this code made itself
// (setScroll: re-centring the path, resetting the menu) is not a fling.
const FLING_MS = 150;
function flingGuard(region) {
  let lastScroll = -Infinity, downPos = 0, downMoving = false, ownPos = null;
  const pos = () => region.scrollLeft + region.scrollTop;
  region.addEventListener('scroll', () => { if (ownPos !== null && Math.abs(pos() - ownPos) < 1) { ownPos = null; return; } ownPos = null; lastScroll = performance.now(); }, { passive: true });
  const pick = () => !downMoving && Math.abs(pos() - downPos) < 2;
  pick.setScroll = (left, top) => { const p0 = pos(); region.scrollLeft = left; region.scrollTop = top; if (pos() !== p0) ownPos = pos(); };
  region.addEventListener('pointerdown', () => {
    downMoving = performance.now() - lastScroll < FLING_MS;
    downPos = pos();
  }, true);
  return pick;
}
let menuOpen = false, recent = [], pathKey = null, levelsKey = null, lastPathId = null;
const RECENT_MAX = 4;
// Recent words, newest first. The saves do not record when a word was found, so on entering a level the
// row starts from the last few saved target words (save order), marked "old"; words found now go in front.
function seedRecent() { recent = found.slice(-RECENT_MAX).reverse(); recentFresh = 0; }
let recentFresh = 0;
function addRecent(w) { recent = [w, ...recent.filter(x => x !== w)].slice(0, RECENT_MAX); recentFresh = Math.min(RECENT_MAX, recentFresh + 1); }
function drawRecent() {
  const el = $('recent');
  const key = recent.join() + '|' + recentFresh;
  if (el.dataset.k === key) return;
  el.dataset.k = key; el.textContent = '';
  if (!recent.length) { const s = document.createElement('span'); s.className = 'empty'; s.textContent = 'Find a word!'; el.appendChild(s); return; }
  recent.forEach((w, i) => {
    const s = document.createElement('span');
    s.textContent = (bonus.includes(w) ? '⭐' : '') + w;
    s.className = (bonus.includes(w) ? 'bonus' : '') + (i >= recentFresh ? ' old' : '');
    el.appendChild(s);
  });
  // Drop chips from the end until the row fits (no clipping mid-word on a narrow phone).
  while (el.children.length > 1 && el.scrollWidth > el.clientWidth + 1) el.lastChild.remove();
}
// Shrink the typed word so 12 letters still fit between Peek and Hear.
function fitWord() {
  const w = $('word'), n = Math.max(typed.length, 1), room = w.parentElement.clientWidth || 200;
  let fs = Math.max(16, Math.min(36, room / (n * 0.62 + 0.4)));
  w.style.fontSize = fs + 'px';
  // 0.62em is an average glyph; wide letters (w, m) need the measured correction so the caret stays in view.
  if (w.scrollWidth > w.clientWidth + 1) w.style.fontSize = Math.max(12, fs * w.clientWidth / w.scrollWidth - 0.5) + 'px';
}
// Shrink el's font until no word is wider than its box. The title and the level names wrap only at spaces
// (overflow-wrap:normal), so a long name overflows instead of breaking as "Snapdrago/n", and the overflow
// is what scrollWidth measures. Call while el is displayed.
function fitText(el, minPx) {
  el.style.fontSize = '';
  let fs = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 0.5 && fs > minPx) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
}
function fitTitle() { fitText($('pnum'), 12); }
function fitLevels() { document.querySelectorAll('#levels .lvl span').forEach(sp => fitText(sp, 10)); }
// Refit what depends on text width when the width or the font changes (Andika / Baloo 2 arrive late).
function refit() { fitTitle(); fitWord(); $('recent').dataset.k = ''; drawRecent(); if (menuOpen) fitLevels(); }
window.addEventListener('resize', refit);
try { document.fonts.addEventListener('loadingdone', refit); document.fonts.ready.then(refit); } catch (e) {}
// Small flower icon for a level: seed (not started), sprout (started), bud (half), bloom (all found).
function stageOf(pr) { const f = pr.total ? pr.found / pr.total : 0; return f >= 1 ? 3 : f >= .5 ? 2 : f > 0 ? 1 : 0; }
function flowerIcon(stage) {
  const soil = '<ellipse cx="18" cy="31" rx="11" ry="3.5" fill="var(--warn)" opacity=".6"/>';
  if (stage === 0) return '<svg viewBox="0 0 36 36" aria-hidden="true">' + soil + '<ellipse cx="18" cy="27" rx="4" ry="3" fill="var(--muted)"/></svg>';
  const stem = '<path d="M18 30V' + (stage === 1 ? 20 : 13) + '" stroke="var(--leaf)" stroke-width="2.5" stroke-linecap="round"/>' +
    '<ellipse cx="13.5" cy="' + (stage === 1 ? 21 : 22) + '" rx="4.5" ry="2.2" fill="var(--leaf)" transform="rotate(-25 13.5 22)"/>';
  if (stage === 1) return '<svg viewBox="0 0 36 36" aria-hidden="true">' + soil + stem + '<ellipse cx="22.5" cy="19" rx="4.5" ry="2.2" fill="var(--leaf)" transform="rotate(25 22.5 19)"/></svg>';
  if (stage === 2) return '<svg viewBox="0 0 36 36" aria-hidden="true">' + soil + stem + '<ellipse cx="18" cy="10" rx="5" ry="6.5" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/></svg>';
  let petals = '';
  for (let i = 0; i < 5; i++) { const a = (i * 72 - 90) * Math.PI / 180; petals += '<circle cx="' + (18 + 6.5 * Math.cos(a)).toFixed(1) + '" cy="' + (11 + 6.5 * Math.sin(a)).toFixed(1) + '" r="4.6" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>'; }
  return '<svg viewBox="0 0 36 36" aria-hidden="true">' + soil + stem + petals + '<circle cx="18" cy="11" r="3.6" fill="var(--center)"/></svg>';
}
function levelInfo() {
  const cur = P[idx].id;
  return Game.order().map(id => { const pr = Game.progress(id); return { id, name: P[indexOf(id)].name, pr, st: stageOf(pr), cur: id === cur }; });
}
// The path is rebuilt only when the order, the level or any progress changes, never on a letter tap
// (rebuilding would drop a finger resting on it).
const pathPick = flingGuard($('path'));
function drawPath() {
  const info = levelInfo(), strip = $('path');
  const key = info.map(l => l.id + l.st + (l.cur ? '*' : '')).join();
  if (key === pathKey) return;
  pathKey = key; strip.textContent = '';
  const doneHere = found.length === P[idx].w.length;
  info.forEach((l, i) => {
    const b = document.createElement('button');
    b.innerHTML = flowerIcon(l.st);
    b.setAttribute('aria-label', 'Level ' + l.name + ', ' + l.pr.found + ' of ' + l.pr.total);
    if (l.cur) b.setAttribute('aria-current', 'true');
    onTap(b, () => { if (!l.cur && pathPick()) Game.goTo(l.id); });
    strip.appendChild(b);
  });
  // Keep the current flower in the middle of the strip. Set scrollLeft directly: scrollIntoView could
  // also move the (overflow:hidden) page.
  const ci = info.findIndex(l => l.cur), cb = strip.children[ci];
  if (cb && P[idx].id !== lastPathId) {
    if (lastPathId !== null) guardGhost();
    lastPathId = P[idx].id;
    // Position inside the strip's scrolled content from rects (offsetLeft is relative to body, not the strip).
    const x = cb.getBoundingClientRect().left - strip.getBoundingClientRect().left - strip.clientLeft + strip.scrollLeft;
    pathPick.setScroll(Math.max(0, x - (strip.clientWidth - cb.offsetWidth) / 2), 0);
  }
}
const levelPick = flingGuard($('drawerbody'));
function drawLevels() {
  const info = levelInfo(), box = $('levels');
  const key = info.map(l => l.id + l.pr.found + (l.cur ? '*' : '')).join();
  if (key === levelsKey) return;
  levelsKey = key; box.textContent = '';
  info.forEach(l => {
    const b = document.createElement('button');
    b.className = 'lvl';
    b.innerHTML = flowerIcon(l.st) + '<span>' + l.name + '<small>' + l.pr.found + ' of ' + l.pr.total + '</small></span>';
    b.setAttribute('aria-label', 'Level ' + l.name + ', ' + l.pr.found + ' of ' + l.pr.total);
    if (l.cur) b.setAttribute('aria-current', 'true');
    onTap(b, () => { if (!levelPick()) return; closeMenu(); if (!l.cur) Game.goTo(l.id); });
    box.appendChild(b);
  });
  if (!$('menu').hidden) fitLevels();
}
// Menu drawer. Closed: [hidden] on #menu. Open: #game is inert (no letter tap, click or Tab focus reaches it)
// and the backdrop covers it; closes on X, a backdrop tap, or Escape.
function openMenu() {
  if (menuOpen) return;
  guardGhost();
  menuOpen = true; levelsKey = null; drawLevels(); setShuf();
  $('menu').hidden = false; $('game').inert = true; $('menubtn').setAttribute('aria-expanded', 'true');
  levelPick.setScroll(0, 0); fitLevels();
  try { $('close').focus({ preventScroll: true }); } catch (e) {}
}
function closeMenu() {
  if (!menuOpen) return;
  guardGhost();
  menuOpen = false;
  $('menu').hidden = true; $('game').inert = false; $('menubtn').setAttribute('aria-expanded', 'false');
  try { $('menubtn').focus({ preventScroll: true }); } catch (e) {}
}
onTap($('menubtn'), openMenu);
onTap($('close'), closeMenu);
// The backdrop covers the whole screen, so onTap's "lifted inside the button" test always passes: also
// require that the finger did not travel, so sliding off the backdrop cancels like any other button.
let bdX = 0, bdY = 0, bdUpX = 0, bdUpY = 0;
$('backdrop').addEventListener('pointerdown', e => { bdX = e.clientX; bdY = e.clientY; });
$('backdrop').addEventListener('pointerup', e => { bdUpX = e.clientX; bdUpY = e.clientY; });  // runs before onTap's
onTap($('backdrop'), () => { if (Math.hypot(bdUpX - bdX, bdUpY - bdY) <= TAP_SLOP) closeMenu(); });
// prev/next live in the menu: go there and close it so the child sees the new flower straight away.
onTap($('next'), () => closeMenu());
onTap($('prev'), () => closeMenu());
function setShuf() {
  const b = $('shuf'), on = Game.shuffle;
  b.setAttribute('aria-pressed', on);
  b.textContent = '🔀 Mix up the flowers';
}
onTap($('shuf'), () => { Game.setShuffle(!Game.shuffle); setShuf(); lastPathId = null; pathKey = null; drawPath(); levelsKey = null; drawLevels(); });

load();
</script>
