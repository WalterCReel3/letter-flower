<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Viewport: maximum-scale=1, user-scalable=no (lead decision for fix-c, overriding core's choice to keep
     pinch-zoom): an accidental pinch on this fixed one-screen game is hard for a 6-7 year old to undo. An adult
     who needs zoom can still get it: Chrome's Accessibility > "Force enable zoom" overrides this tag.
     Double-tap zoom and the tap delay are also removed with touch-action.
     interactive-widget is not set: the game has no text inputs, so the on-screen keyboard never opens. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Letter Flower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}

/* Layout: one column garden; growing plant beside the score, the letter flower is the hero, found words below. */
:root{
  --sky:#eef6f7; --card:#ffffff; --ink:#23323a; --muted:#5d6f78;
  --petal:#ffd6e3; --petal-ink:#7a1f45; --center:#ffc93c; --center-ink:#3d2a00;
  --leaf:#3f9b5a; --leaf-soft:#d5efdc; --line:#cfe1e4; --warn:#b5452b;
  /* Fallbacks matter: offline (and on Android without Trebuchet/Comic Sans) these land on system-ui. */
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#142227; --card:#1c2e34; --ink:#eaf3f4; --muted:#a6bac0;
  --petal:#6b2a46; --petal-ink:#ffe3ee; --center:#f2b827; --center-ink:#2a1c00;
  --leaf:#6fcf8a; --leaf-soft:#20402c; --line:#2f4950; --warn:#ff9a7f; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#142227; --card:#1c2e34; --ink:#eaf3f4; --muted:#a6bac0;
  --petal:#6b2a46; --petal-ink:#ffe3ee; --center:#f2b827; --center-ink:#2a1c00;
  --leaf:#6fcf8a; --leaf-soft:#20402c; --line:#2f4950; --warn:#ff9a7f; color-scheme:dark}
/* overscroll-behavior:none stops Chrome's pull-to-refresh from reloading the game mid-word. */
html,body{background:var(--sky);color:var(--ink);overscroll-behavior:none}
/* No text selection, long-press callout/menu, Touch-to-Search or grey tap flash anywhere in the game. */
body{font-family:var(--read);padding-inline:16px;padding-block:12px 28px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;margin:0;line-height:1;text-wrap:balance}
.tools{display:flex;gap:8px}
.chip{font:700 .95rem var(--read);background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;touch-action:none}
.chip[aria-pressed="false"]{color:var(--muted)}
.score{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 16px}
.score svg{flex:none}
.rank{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1}
.count{color:var(--muted);font-size:1.05rem}
.word{min-height:64px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:700;letter-spacing:.06em;text-align:center;overflow-wrap:anywhere}
.word .c{color:var(--leaf)}
.word .caret{display:inline-block;width:3px;height:1em;background:var(--ink);margin-left:4px;animation:blink 1s steps(1) infinite;vertical-align:-.12em}
.word.full{animation:full .35s}
@keyframes full{25%{transform:translateX(-6px);color:var(--warn)}75%{transform:translateX(6px);color:var(--warn)}}
@keyframes blink{50%{opacity:0}}
.msg{min-height:2rem;text-align:center;font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--leaf)}
.msg.no{color:var(--warn)}
/* touch-action:none on the flower: no pan, zoom or double-tap gesture can start on the letters. */
.flower{position:relative;width:min(300px,86vw);aspect-ratio:1;margin:0 auto;max-width:100%;touch-action:none}
.flower button{position:absolute;width:31%;aspect-ratio:1;border-radius:50%;border:none;font:700 clamp(2rem,10vw,2.8rem) var(--read);cursor:pointer;transform:translate(-50%,-50%);transition:transform .12s;touch-action:none;padding:0 0 .12em}
.flower button.o{background:var(--petal);color:var(--petal-ink)}
.flower button.m{background:var(--center);color:var(--center-ink);box-shadow:0 0 0 6px var(--leaf-soft)}
.flower button:active{transform:translate(-50%,-50%) scale(.9)}
.flower button:focus-visible,.btn:focus-visible,.chip:focus-visible,.found button:focus-visible{outline:4px solid var(--leaf);outline-offset:3px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
/* Action buttons fire on pointerup inside the button; touch-action:none so a slight slide is not taken as a scroll. */
.btn{font:800 1.2rem var(--display);border-radius:999px;padding:10px 20px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;min-width:96px;touch-action:none}
.actions.main{flex-wrap:nowrap;gap:8px;max-width:340px;margin:0 auto;width:100%}
.actions.main .btn{flex:1 1 0;min-width:0;padding:8px 6px;font-size:1.05rem;white-space:nowrap}
.btn.go{background:var(--leaf);border-color:var(--leaf);color:var(--card)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-family:var(--display);font-size:1.15rem}
.found{display:flex;flex-wrap:wrap;gap:8px}
.found button{font:700 1.3rem var(--read);color:var(--ink);background:var(--leaf-soft);border:none;border-radius:12px;padding:4px 12px;cursor:pointer}
.found button.bonus{background:var(--petal);color:var(--petal-ink)}
/* Scrollable inner regions (menu panel, level list, a long found-word list).
   touch-action:none is set on the game buttons themselves (flower, .btn, .chip), never on a container, so a
   region opts back in to vertical scrolling just by carrying class="scroll". Buttons inside it allow pan-y:
   a swipe that starts on one scrolls the list, Chrome sends pointercancel, and onTap treats that as no tap.
   Rule for variants: never put touch-action:none on an ancestor of a .scroll region (the browser intersects
   touch-action down the tree, so it would block the scroll), and wire its buttons with onTap. */
.scroll{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.scroll button,.found button{touch-action:pan-y}
.note{font-size:.95rem;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:1.05rem}
.left{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:1.05rem}
.left b{color:var(--ink)}
.hintline{font-size:1.6rem;letter-spacing:.15em;font-weight:700;min-height:1.6em}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted)}
.grow{transition:all .5s}

/* ===== Variant C "Pot & Petals": one fixed screen. The plant in its pot is the progress picture; found words
   drop into the pot as seed tags. Word lists, sound, levels and help live in the menu sheet.
   Rules below override the core rules above by coming later; the core input rules (user-select, callout,
   touch-action on .flower/.btn/.chip, .scroll opt-in) are kept as they are. ===== */
:root{--pot:#c8673f; --pot-rim:#d97d55; --soil:#6b4a2b; --tag:#fff7e3; --tag-ink:#4a3313; --shade:rgba(20,30,35,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pot:#9c4c2e; --pot-rim:#b25d3b; --soil:#3d2a18; --tag:#3a3022; --tag-ink:#fbe9c8; --shade:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--pot:#9c4c2e; --pot-rim:#b25d3b; --soil:#3d2a18; --tag:#3a3022; --tag-ink:#fbe9c8; --shade:rgba(0,0,0,.6)}
/* The page itself never scrolls: html/body are clipped to the screen, the game is a 100dvh flex column. */
:root{padding:0}
html,body{height:100%;overflow:hidden}
body{padding:0}
.wrap{height:100dvh;box-sizing:border-box;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  gap:clamp(4px,1dvh,10px);padding:calc(6px + env(safe-area-inset-top,0px)) 12px calc(8px + env(safe-area-inset-bottom,0px));overflow:hidden}
header{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.iconbtn{flex:none;width:52px;height:52px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);
  font:800 1.6rem/1 var(--display);cursor:pointer;touch-action:none;padding:0;display:grid;place-items:center}
/* The full level name always shows: fitText() shrinks the font for long names (Snapdragon) instead of an ellipsis.
   line-height 1.4 so descenders (p, y, g) are not cut by overflow:hidden. */
#pnum{flex:1;min-width:0;text-align:center;font:800 clamp(1.35rem,6.4vw,1.8rem)/1.4 var(--display);white-space:nowrap;overflow:hidden}
#next{flex:none;min-height:52px;padding:0 12px;font:800 1.05rem var(--display)}
#next.ready{background:var(--leaf);border-color:var(--leaf);color:var(--card);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.08)}}
.chip{min-height:48px}
.iconbtn:focus-visible,.tag:focus-visible,.lvl:focus-visible{outline:4px solid var(--leaf);outline-offset:3px}

/* Garden: the plant takes whatever height is left over; the pot sits under it. */
.garden{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;position:relative}
#plant{flex:1 1 auto;min-height:36px;width:100%;display:block;overflow:visible}
.grow{transition:transform .6s cubic-bezier(.3,1.5,.6,1),stroke-dashoffset .6s ease,opacity .4s}
#stem{fill:none;stroke:var(--leaf);stroke-width:7;stroke-linecap:round}
.leaf{fill:var(--leaf);transform-box:fill-box;transform:scale(0)}
.leaf.r{transform-origin:0% 75%}.leaf.l{transform-origin:100% 75%}
#head{transform-box:view-box;transform-origin:100px 50px;transform:scale(0)}
.badge{position:absolute;right:2px;top:0;font:800 1.1rem var(--display);color:var(--muted);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 10px}
/* Feedback floats as a bubble just above the pot (over the stem, not the bloom), so it costs no height of its own. */
.msg{position:absolute;left:50%;bottom:calc(clamp(54px,8.5dvh,66px) + 6px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 16px);min-height:0;box-sizing:border-box;
  background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px 12px;font-size:clamp(1rem,4.6vw,1.25rem);line-height:1.2;pointer-events:none;z-index:1}
.msg:empty{display:none}
.pot{flex:none;position:relative;isolation:isolate;width:min(360px,96%);height:clamp(54px,8.5dvh,66px);display:flex;align-items:center;justify-content:center;
  gap:6px;padding:10px 9% 2px;box-sizing:border-box;overflow:visible}
.pot::before{content:"";position:absolute;inset:8px 0 0;background:var(--pot);clip-path:polygon(0 0,100% 0,90% 100%,10% 100%);z-index:-1}
.pot::after{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:var(--pot-rim);border-radius:7px;z-index:-1}
.tag{flex:none;font:700 clamp(1rem,4.4vw,1.2rem) var(--read);min-height:40px;padding:0 10px;border:none;border-radius:12px 12px 12px 3px;
  background:var(--tag);color:var(--tag-ink);box-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer;touch-action:none;white-space:nowrap}
.tag.bonus{background:var(--petal);color:var(--petal-ink)}
.tag.more{background:var(--leaf);color:var(--card)}
.tag.drop{animation:drop .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{0%{transform:translateY(-120px) rotate(-12deg);opacity:0}50%{opacity:1}100%{transform:none}}

.word{flex:none;min-height:clamp(40px,7dvh,56px);font-size:clamp(1.8rem,8.4vw,2.5rem);white-space:nowrap;overflow:hidden}
.flower{flex:none;width:clamp(210px,min(84vw,34dvh),320px)}
.actions.main,.hints{flex:none;display:flex;flex-wrap:nowrap;gap:8px;width:100%;max-width:400px;margin:0 auto}
.actions.main .btn,.hints .btn{flex:1 1 0;min-width:0;min-height:50px;padding:6px;font-size:clamp(1rem,4.6vw,1.15rem);white-space:nowrap}
.hints .btn{flex:0 0 30%}
.hintline{flex:1 1 auto;min-width:0;align-self:center;text-align:center;font-size:clamp(1.2rem,5.4vw,1.6rem);min-height:0;white-space:nowrap;overflow:hidden}

/* Menu sheet. Closed = [hidden] (display:none), so none of its buttons count as on the page.
   While open, #game is inert and covered by the backdrop, so letter taps cannot reach the game.
   Only .sheetbody scrolls (class="scroll"); no ancestor of it has touch-action:none. */
.menu{position:fixed;inset:0;z-index:10}
.backdrop{position:absolute;inset:0;background:var(--shade);touch-action:none}
.sheet{position:absolute;top:0;bottom:0;left:0;width:min(380px,90vw);background:var(--sky);display:flex;flex-direction:column;
  box-shadow:4px 0 24px rgba(0,0,0,.3);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .25s ease-out}
/* A fade, not a slide: the rows are in their final place from the first frame, so a quick tap while the sheet
   is still appearing lands on the row under the finger (a 250ms slide made a mid-slide tap miss its row). */
@keyframes slide{from{opacity:0}}
.sheethead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.sheethead h2{margin:0;font:800 1.5rem var(--display)}
.sheetbody{flex:1 1 auto;min-height:0;padding:0 12px 24px;display:flex;flex-direction:column;gap:12px}
.sheetbody section{flex:none;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.sheetbody h3{margin:0;font:800 1.2rem var(--display)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.levels{display:flex;flex-direction:column;gap:6px}
.lvl{display:flex;align-items:center;gap:10px;min-height:52px;width:100%;text-align:left;font:700 1.15rem var(--read);color:var(--ink);
  background:var(--sky);border:2px solid var(--line);border-radius:14px;padding:4px 12px;cursor:pointer}
.lvl .n{flex:1}.lvl .p{color:var(--muted);font-size:1rem}
.lvl[aria-current="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.howto{margin:0;padding-left:1.3em;font-size:1.1rem;line-height:1.5}
.found button{min-height:44px}
@media (prefers-reduced-motion:reduce){.grow,.flower button{transition:none}.word .caret{animation:none}.word.full{animation:none}
  .tag.drop,.sheet,#next.ready{animation:none}}
</style>
</head>
<body>

<div class="wrap" id="game">
  <header>
    <button class="iconbtn" id="menubtn" aria-label="Menu" aria-haspopup="dialog" aria-expanded="false">☰</button>
    <span id="pnum">Level Daisy</span>
    <button class="chip" id="next" aria-label="Next flower">Next ▶</button>
  </header>

  <!-- Progress is the picture: the plant grows (seed, stem, leaves, bud, bloom) as target words are found. -->
  <div class="garden">
    <svg id="plant" viewBox="0 0 200 220" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <ellipse id="seed" class="grow" cx="100" cy="214" rx="9" ry="6" fill="var(--soil)"/>
      <path id="stem" class="grow" pathLength="100" stroke-dasharray="100 200" stroke-dashoffset="100" d="M100 220 C 90 170, 110 120, 100 50"/>
      <path class="leaf grow r" data-at=".15" d="M101 184 q 24 -26 50 -8 q -24 20 -50 8z"/>
      <path class="leaf grow l" data-at=".35" d="M101 154 q -24 -26 -50 -8 q 24 20 50 8z"/>
      <path class="leaf grow r" data-at=".55" d="M103 122 q 22 -24 46 -8 q -22 18 -46 8z"/>
      <path class="leaf grow l" data-at=".72" d="M101 96 q -20 -22 -42 -7 q 20 16 42 7z"/>
      <g id="head" class="grow">
        <g id="bud">
          <path d="M100 58 q -16 -6 -14 -26 q 14 -10 28 0 q 2 20 -14 26z" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1.5"/>
          <path d="M100 60 q -18 -2 -18 -16 q 10 6 18 6 q 8 0 18 -6 q 0 14 -18 16z" fill="var(--leaf)"/>
        </g>
        <g id="bloom" opacity="0">
          <g fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1.5">
            <ellipse cx="100" cy="22" rx="11" ry="20"/>
            <ellipse cx="100" cy="22" rx="11" ry="20" transform="rotate(45 100 42)"/>
            <ellipse cx="100" cy="22" rx="11" ry="20" transform="rotate(90 100 42)"/>
            <ellipse cx="100" cy="22" rx="11" ry="20" transform="rotate(135 100 42)"/>
            <ellipse cx="100" cy="22" rx="11" ry="20" transform="rotate(180 100 42)"/>
            <ellipse cx="100" cy="22" rx="11" ry="20" transform="rotate(225 100 42)"/>
            <ellipse cx="100" cy="22" rx="11" ry="20" transform="rotate(270 100 42)"/>
            <ellipse cx="100" cy="22" rx="11" ry="20" transform="rotate(315 100 42)"/>
          </g>
          <circle cx="100" cy="42" r="12" fill="var(--center)" stroke="var(--center-ink)" stroke-width="1"/>
        </g>
      </g>
    </svg>
    <div class="badge" id="count" aria-label="0 of 0 words">0/0</div>
    <div class="msg" id="msg" role="status">Every word needs the yellow letter!</div>
    <!-- The pot: newest found words drop in as seed tags (tap to hear). "+N" opens the menu's full list. -->
    <div class="pot" id="pot" aria-label="Words in the pot"></div>
  </div>

  <div class="word" id="word" aria-live="polite"></div>

  <div class="flower" id="flower"></div>

  <div class="actions main">
    <button class="btn" id="del">⌫ Back</button>
    <button class="btn" id="mix">🔄 Mix</button>
    <button class="btn go" id="enter">✓ Check</button>
  </div>

  <div class="hints">
    <button class="btn" id="peek">👀 Peek</button>
    <div class="hintline" id="hintline" aria-live="polite"></div>
    <button class="btn" id="hear">👂 Hear</button>
  </div>
</div>

<!-- Menu sheet: closed = hidden (display:none). Opened from the ☰ button. -->
<div class="menu" id="menu" hidden>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="sheethead">
      <h2 id="mtitle">🌼 Menu</h2>
      <button class="iconbtn" id="close" aria-label="Close menu">✕</button>
    </div>
    <div class="sheetbody scroll" id="sheetbody">
      <div class="row">
        <button class="chip" id="sound" aria-pressed="true">🔊 Sound on</button>
        <button class="chip" id="shuf" aria-pressed="false">🔀 Mix up the flowers</button>
      </div>
      <section>
        <h3>📝 My words</h3>
        <div class="found" id="found"></div>
        <p class="note" id="bonusnote" hidden>⭐ = bonus word</p>
        <div class="left" id="left"></div>
      </section>
      <section>
        <h3>🌷 Flowers</h3>
        <div class="row"><button class="chip" id="prev">◀ Last flower</button></div>
        <div class="levels" id="levels"></div>
      </section>
      <section>
        <h3>❓ How to play</h3>
        <ol class="howto">
          <li>Tap letters to make a word.</li>
          <li>Every word needs the <b>yellow</b> letter.</li>
          <li>Tap <b>✓ Check</b>.</li>
          <li>Each word helps your flower grow!</li>
          <li>Stuck? Tap <b>👀 Peek</b> or <b>👂 Hear</b>.</li>
        </ol>
      </section>
    </div>
  </div>
</div>

<script>
/*
 * Levels. Each puzzle: id (permanent save key), name (shown as "Level <name>"),
 * c = center letter (in every word), o = the six petal letters, w = target words, b = bonus words.
 *
 * Order is baked, not computed at runtime, so it is the same on every device and reload.
 * It was produced ONCE from the original letter-flower.html P array (original puzzles 1..30) by a
 * Fisher-Yates shuffle (for i = n-1 down to 1: j = floor(rand() * (i+1)); swap i, j) driven by
 * mulberry32 with seed 20261017; names were then assigned in list order (Daisy, Tulip, Rose, ...).
 * Bonus lists had these non-kid entries removed: bafta brit goa otto orc parr tor playa hath thee
 * thine ken roc ted mon monte conte carte chino newton. Target (w) words were not touched.
 */
const P=[

function pickVoice() {

    voice = v.find(x => /^en[-_]US/i.test(x.lang) && x.localService) || v.find(x => /^en/i.test(x.lang)) || null;
  } catch (e) {}
}

function unlock() {

/* ---------- Input ---------- */
// Letters fire on pointerdown: one contact = one letter, immediately, per pointer, so a resting palm or a
// second finger never blocks or doubles a tap. The click that a pointer contact produces (however long the
// press was) is swallowed; a click with no pointer contact before it (keyboard Enter/Space, screen reader
// activation) still types the letter.
// The swallow window is measured from the pointerup, not the pointerdown: the browser dispatches a pointer's
// click right after its pointerup however long the press lasted. A contact that never produces a click
// (long-press, drag-off) therefore leaves nothing behind that could eat a later screen-reader click.
const CLICK_AFTER_UP_MS = 800;
function swallowClickAfterPointer(el, fn) {
  let upAt = -Infinity;  // when the last primary pointer contact on el ended
  el.addEventListener('pointerup', e => { if (!(e.pointerType === 'mouse' && e.button !== 0)) upAt = performance.now(); });
  el.addEventListener('keydown', () => { upAt = -Infinity; });
  el.addEventListener('click', () => {
    if (performance.now() - upAt < CLICK_AFTER_UP_MS) { upAt = -Infinity; return; }
    if (!el.disabled) fn();
  });
}
function onPress(el, fn) {
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    fn();
  });
  swallowClickAfterPointer(el, fn);
}
// Action buttons fire on pointerup inside the button (plus a little slop), not pointerdown: a child resting
// a finger on Check while reaching for letters must not submit, and a finger that slides off can take it
// back. touch-action:none on these buttons means a slight slide is not turned into a scroll (which would
// cancel the pointer and, with plain 'click', silently drop the tap).
// A contact held longer than TAP_MAX_MS is not a tap (a palm resting on Check must not submit when it lifts);
// 1.5 s rather than shorter so a slow, deliberate press by a 6-year-old still counts.
// The pointer is captured on pointerdown, so its pointerup always comes back here and downId cannot go stale
// (a mouse released elsewhere used to leave it set). pointercancel (e.g. the finger started a scroll in a
// .scroll region) means no tap.
const TAP_SLOP = 16, TAP_MAX_MS = 1500;
function onTap(el, fn) {
  let downId = null, downAt = 0;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    downId = e.pointerId; downAt = performance.now();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  el.addEventListener('pointerup', e => {
    if (e.pointerId !== downId) return;
    downId = null;
    if (performance.now() - downAt > TAP_MAX_MS) return;
    const r = el.getBoundingClientRect();
    if (e.clientX >= r.left - TAP_SLOP && e.clientX <= r.right + TAP_SLOP &&
        e.clientY >= r.top - TAP_SLOP && e.clientY <= r.bottom + TAP_SLOP && !el.disabled) fn();
  });
  const drop = e => { if (e.pointerId === downId) downId = null; };
  el.addEventListener('pointercancel', drop);
  el.addEventListener('lostpointercapture', drop);
  swallowClickAfterPointer(el, fn);
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function saveWord(kind, list, allowed, w) {
  const key = 'lf2-' + kind + '-' + P[idx].id;

  $('bonusnote').hidden = !bonus.length;
  const left = {};
  p.w.filter(w => !found.includes(w)).forEach(w => left[w.length] = (left[w.length] || 0) + 1);
  const keys = Object.keys(left);
  $('left').innerHTML = keys.length ? keys.map(k => '<span><b>' + left[k] + '</b> with ' + k + ' letters</span>').join('') : '<span><b>You found them all!</b></span>';
  if (hint && found.includes(hint.w)) hint = null;
  const ht = hint ? hint.w.split('').map((ch, i) => i < hint.k ? ch : '_').join(' ') : '';
  if ($('hintline').textContent !== ht) { $('hintline').textContent = ht; fitText($('hintline'), 13); }
  // Re-entrancy guard: a listener that calls Game.goTo()/setShuffle() re-renders, but listeners are not
  // called again from inside a listener, so an unconditional goTo() in onChange cannot recurse forever.
  // (Such a listener does not hear about the change it caused itself.)
  if (notifying) return;
  notifying = true;
  try { listeners.forEach(fn => { try { fn(Game.state()); } catch (e) {} }); } finally { notifying = false; }
}
function flash(t, bad) {
  $('msg').textContent = t; $('msg').className = 'msg' + (bad ? ' no' : '');
  clearTimeout(msgT); msgT = setTimeout(() => { $('msg').textContent = ''; }, 2600);
}
function type(ch) {
  if (typed.length >= MAX_LETTERS) {
    const w = $('word'); w.classList.remove('full'); void w.offsetWidth; w.classList.add('full');
    clearTimeout(fullT); fullT = setTimeout(() => w.classList.remove('full'), 400);
    flash('That is the most letters! Tap Check or Back.', 1);
    return;
  }
  typed += ch; render();
}
function back() { typed = typed.slice(0, -1); render(); }
function check() {
  const p = P[idx], w = typed; if (!w) return; typed = '';
  let speak = null;
  if (w.length < 3) flash('Words need 3 letters or more.', 1);
  else if (!w.includes(p.c)) flash('Use the yellow letter!', 1);
  else if (found.includes(w) || bonus.includes(w)) flash('You already found ' + w + '!', 1);
  else if (p.b.includes(w)) { bonus = saveWord('bonus', bonus, p.b, w); flash('Bonus word! ' + w); speak = w; }
  else if (p.w.includes(w)) {
    found = saveWord('found', found, p.w, w);
    if (found.length === p.w.length) { flash('Super Bloom! 🌸');   // short: one line, so the bubble does not hide the plant
      speak = w + '! You found every word!'; }
    else { flash(CHEERS[Math.random() * CHEERS.length | 0] + ' ' + w); speak = w; }
  }
  else flash('Hmm, try a different word.', 1);
  render();          // update the screen first, then speak
  if (speak) say(speak);
}
function pickHint() {
  const left = P[idx].w.filter(w => !found.includes(w)); if (!left.length) return null;
  if (hint && left.includes(hint.w)) return hint;
  return { w: left[Math.random() * left.length | 0], k: 1 };
}
function hear() { hint = pickHint(); if (!hint) return; render(); if (sound) say(hint.w); else flash('Turn sound on to hear it.', 1); }
function peek() { const had = hint; hint = pickHint(); if (!hint) return; if (had === hint && hint.k < hint.w.length - 1) hint.k++; render(); }
function mix() { outer = shuffle(outer); drawFlower(); }
function goIndex(i) { idx = i; load(); lockGame(); }
// Next/prev follow the current order (baked, or this startup's shuffle), wrapping at the ends.
function step(d) { const n = order.length; goIndex(order[(order.indexOf(idx) + d + n) % n]); }
function setShuffle(on) {
  shuffleOn = !!on; store.set('lf2-shuffle', shuffleOn);
  order = makeOrder();   // stays on the current level; only what comes next changes
  render();
}

onTap($('hear'), hear);
onTap($('peek'), peek);
onTap($('del'), back);
onTap($('enter'), check);
onTap($('mix'), mix);
onTap($('next'), () => step(1));
onTap($('prev'), () => step(-1));

const sb = $('sound');
function setSound() {
  if (!TTS) { sb.textContent = '🔇 No voice here'; sb.disabled = true; sb.title = 'This browser or app has no speech. Try opening the game in Safari or Chrome.'; $('hear').hidden = true; return; }
  sb.textContent = sound ? '🔊 Sound on' : '🔇 Sound off'; sb.setAttribute('aria-pressed', sound);
}
onTap(sb, () => { sound = !sound; store.set('lf2-sound', sound); setSound(); if (sound) say('Sound on'); });
setSound();

// Physical keyboard. Enter/Space on a button the player reached with Tab activate that button natively;
// otherwise Enter = Check, Space = Mix, Backspace = Back, letters type. (Not :focus-visible: Chrome turns
// that on for a mouse-focused button as soon as any key is typed, which would make Enter add a letter.)
let tabFocused = null, lastInputKey = false;
document.addEventListener('pointerdown', () => { lastInputKey = false; tabFocused = null; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Tab') lastInputKey = true; }, true);
document.addEventListener('focusin', e => { tabFocused = lastInputKey ? e.target : null; });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), p = P[idx], t = e.target;
  if ((k === 'enter' || k === ' ') && t && t.tagName === 'BUTTON' && t === tabFocused) return;
  if (k === 'enter') { e.preventDefault(); check(); }
  else if (k === 'backspace') { e.preventDefault(); back(); }
  else if (k === ' ') { e.preventDefault(); mix(); }
  else if (k.length === 1 && (k === p.c || p.o.includes(k))) { if (!e.repeat) type(k); }
});

/* ---------- API for layout variants ---------- */
// levels: every level in the baked order (fixed). order(): ids in the order play currently follows.
// state().index is the position of the current level in order() (equal to its baked index when shuffle is off).
// onChange(fn) is called after every render; a listener may call goTo/setShuffle, see the guard in render().
window.Game = {
  levels: P.map(p => ({ id: p.id, name: p.name })),
  goTo(id) { const i = indexOf(id); if (i < 0) return false; goIndex(i); return true; },
  state() {
    const p = P[idx];
    return { id: p.id, name: p.name, index: order.indexOf(idx), typed, found: found.slice(), bonus: bonus.slice(), total: p.w.length, done: found.length === p.w.length };
  },
  // Progress for any level without switching to it (for a level picker).
  progress(id) { const p = P[indexOf(id)]; if (!p) return null; return { found: clean(store.get('lf2-found-' + p.id, []), p.w).length, total: p.w.length }; },
  onChange(fn) { listeners.push(fn); },
  get shuffle() { return shuffleOn; },
  setShuffle,
  order() { return order.map(i => P[i].id); }
};

/* ---------- Variant C: plant, pot, menu ---------- */
// Shrink a one-line element's font (from its CSS size, 1px at a time, not below minPx) until its text fits
// its width, so the level name and the Peek blanks are never cut off. A 6-letter Peek ("p _ _ _ _ _") was
// one blank short at 360-412px wide before this.
function fitText(el, minPx) {
  el.style.fontSize = '';
  let f = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth && f > minPx) { f = Math.max(minPx, f - 1); el.style.fontSize = f + 'px'; }
}
window.addEventListener('resize', () => { fitText($('pnum'), 16); fitText($('hintline'), 13); });
// Plant growth from fr = share of target words found. Stem length L: 0 = only a seed, 1 = full height.
// Leaves open as the stem passes them (data-at), a bud rides the stem tip from half way, and it opens
// into a bloom at 100%. Transitions are CSS (.grow), switched off under prefers-reduced-motion.
function drawPlant(fr) {
  const L = fr <= 0 ? 0 : .12 + .88 * fr;
  $('stem').style.strokeDashoffset = 100 - 100 * L;
  $('seed').style.opacity = L ? 0 : 1;
  document.querySelectorAll('#plant .leaf').forEach(l => { l.style.transform = fr >= +l.dataset.at ? 'scale(1)' : 'scale(0)'; });
  const tipY = 220 - 170 * L;
  const s = fr >= 1 ? 1.1 : fr >= .5 ? .6 + .4 * (fr - .5) / .5 : 0;
  $('head').style.transform = 'translate(0px,' + (tipY - 50) + 'px) scale(' + s + ')';
  $('bud').style.opacity = fr >= 1 ? 0 : 1;
  $('bloom').style.opacity = fr >= 1 ? 1 : 0;
}

// The pot shows the newest words first (target and bonus), as many as fit (at most POT_MAX), then "+N".
// Core keeps found and bonus as two lists, so the order between them is only known for words found while this
// page is open; on load the pot starts with target words newest-first, then bonus words.
// Tags are rebuilt only when the list changes (not on every letter), like core's found chips.
const POT_MAX = 4;
let potId = null, seen = new Set(), recent = [], potKey = null, dropWord = null;
function drawPot(p) {
  const all = [...found, ...bonus];
  const rkey = 'lf2-recent-' + p.id;   // lf2- prefix: index.html's reset clears it too
  if (potId !== p.id) {
    potId = p.id; seen = new Set(all); dropWord = null;
    // Saved newest-first order (so a bonus word found last stays first after a reload), then any word the
    // saved order lacks (found in another variant/tab, or before this key existed): targets, then bonus.
    const saved = store.get(rkey, []);
    recent = [...new Set(Array.isArray(saved) ? saved.filter(w => seen.has(w)) : [])];
    [...found].reverse().concat([...bonus].reverse()).forEach(w => { if (!recent.includes(w)) recent.push(w); });
  } else {
    let changed = false;
    all.forEach(w => { if (!seen.has(w)) { seen.add(w); recent.unshift(w); dropWord = w; changed = true; } });
    if (seen.size !== all.length) { seen = new Set(all); recent = recent.filter(w => seen.has(w)); changed = true; }  // reset in another tab
    if (changed) store.set(rkey, recent);
  }
  const key = p.id + '|' + recent.join();
  if (key === potKey) return;
  potKey = key;
  const pot = $('pot'); pot.innerHTML = '';
  const tags = recent.slice(0, POT_MAX).map(w => {
    const b = document.createElement('button');
    const isBonus = bonus.includes(w);
    b.className = 'tag' + (isBonus ? ' bonus' : ''); b.textContent = (isBonus ? '⭐' : '') + w;
    b.setAttribute('aria-label', 'Hear ' + w);
    onTap(b, () => say(w));
    pot.appendChild(b);
    return b;
  });
  let more = null;
  const setMore = shown => {
    const k = recent.length - shown;
    if (k <= 0) { if (more) { more.remove(); more = null; } return; }
    if (!more) {
      more = document.createElement('button'); more.className = 'tag more';
      onTap(more, openMenu); pot.appendChild(more);
    }
    more.textContent = '+' + k; more.setAttribute('aria-label', k + ' more words. Open the menu');
  };
  let shown = tags.length;
  setMore(shown);
  // Drop the oldest tags until the row fits inside the pot (measured, because word lengths vary).
  const cs = getComputedStyle(pot);
  const avail = pot.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const gap = parseFloat(cs.columnGap) || 0;
  const width = () => [...pot.children].reduce((s, c) => s + c.offsetWidth, 0) + gap * (pot.children.length - 1);
  while (shown > 1 && width() > avail) { tags[--shown].remove(); setMore(shown); }
  if (dropWord && recent[0] === dropWord && tags[0]) tags[0].classList.add('drop');
  dropWord = null;
}

// Menu sheet. Closed: [hidden]. Open: #game is inert (no taps, keys or focus reach it) and the backdrop covers it.
const menu = $('menu'), game = $('game');
let menuOpen = false;
function drawLevels() {
  const box = $('levels'); box.innerHTML = ''; const cur = Game.state().id;
  Game.order().forEach(id => {   // follows shuffle mode
    const lv = Game.levels.find(l => l.id === id), pr = Game.progress(id), done = pr.found === pr.total;
    const b = document.createElement('button'); b.className = 'lvl';
    b.innerHTML = '<span aria-hidden="true">' + (done ? '🌸' : pr.found ? '🌱' : '🌰') + '</span><span class="n">' + lv.name +
      '</span><span class="p">' + pr.found + '/' + pr.total + '</span>';
    b.setAttribute('aria-label', lv.name + ', ' + pr.found + ' of ' + pr.total + ' words');
    if (id === cur) b.setAttribute('aria-current', 'true');
    onTap(b, () => { closeMenu(); Game.goTo(id); });
    box.appendChild(b);
  });
}
function syncShuffle() {
  const s = $('shuf'); s.setAttribute('aria-pressed', Game.shuffle);
  s.textContent = '🔀 Mix up the flowers' + (Game.shuffle ? ' ✓' : '');
}
function openMenu() {
  if (menuOpen) return; menuOpen = true;
  drawLevels(); syncShuffle();
  menu.hidden = false; game.inert = true; $('menubtn').setAttribute('aria-expanded', 'true');
  $('sheetbody').scrollTop = 0;
  try { $('close').focus({ preventScroll: true }); } catch (e) {}
}
function closeMenu() {
  if (!menuOpen) return; menuOpen = false;
  menu.hidden = true; game.inert = false; $('menubtn').setAttribute('aria-expanded', 'false'); lockGame();
  try { $('menubtn').focus({ preventScroll: true }); } catch (e) {}
}
// Stray-click guard. On touch, Chrome hit-tests the click that follows a tap again at the finger's spot
// AFTER pointerup, so when a tap changes what is under the finger (opening/closing the menu, picking a level)
// the click lands on a different element: tests showed a backdrop tap typing the letter under it, and the
// "+N" tag's click hitting the new backdrop and closing the menu again. Every handler here already acts on
// pointerdown/pointerup and ignores the click, so a click right after a pointer contact that lands outside
// the element the contact started on is dropped. Keyboard and screen-reader clicks (no pointer) pass.
let pdTarget = null, puAt = -Infinity;
window.addEventListener('pointerdown', e => { pdTarget = e.target; }, true);
window.addEventListener('pointerup', () => { puAt = performance.now(); }, true);
window.addEventListener('click', e => {
  if (performance.now() - puAt < CLICK_AFTER_UP_MS && pdTarget && e.target instanceof Node &&
      !pdTarget.contains(e.target) && !e.target.contains(pdTarget)) { e.stopPropagation(); e.preventDefault(); }
}, true);
// Post-close lockout. A child's quick double tap on a level row or the backdrop: tap 1 closes the menu (or
// changes level), and tap 2's pointerdown lands on the letter or button that was just uncovered and acts on it.
// That second tap is a real pointerdown, not a synthetic click, so the guard above cannot catch it. For
// LOCK_MS after the menu closes or the level changes, pointerdowns on the game are dropped before any button
// sees them (onPress/onTap then never arm, so their pointerup does nothing). Keys are not locked.
const LOCK_MS = 300;
let lockUntil = -Infinity;
function lockGame() { lockUntil = performance.now() + LOCK_MS; }
window.addEventListener('pointerdown', e => {
  if (performance.now() < lockUntil && e.target instanceof Node && game.contains(e.target)) { e.stopPropagation(); e.preventDefault(); }
}, true);
onTap($('menubtn'), openMenu);
onTap($('close'), closeMenu);
onTap($('backdrop'), closeMenu);
onTap($('shuf'), () => { Game.setShuffle(!Game.shuffle); syncShuffle(); drawLevels(); });
onTap($('prev'), closeMenu);   // runs after core's step(-1) on the same button: show the new flower
menu.addEventListener('contextmenu', e => e.preventDefault());
// Keys while the menu is open: Escape closes it; nothing reaches the game's document-level key handler
// (this listener on <html> runs before it in the bubble phase). Enter/Space still activate a focused menu
// button natively, because only propagation is stopped, not the default action.
document.documentElement.addEventListener('keydown', e => {
  if (!menuOpen) return;
  if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }
  e.stopPropagation();
});
// Web fonts (online) change word widths: re-fit the pot once they are in.
try { document.fonts.ready.then(() => { potKey = null; render(); fitText($('pnum'), 16); fitText($('hintline'), 13); }); } catch (e) {}

load();
</script>
</body>
</html>
