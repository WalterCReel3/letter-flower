<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Viewport: maximum-scale=1, user-scalable=no (lead decision, fix-b): an accidental pinch-zoom on a fixed
     one-screen game is hard for a 6-7 year old to undo. Chrome on Android honours it unless the user has
     "Force enable zoom" on in accessibility settings. Double-tap zoom and the tap delay are also removed with
     touch-action. interactive-widget is not set: the game has no text inputs, so the on-screen keyboard never opens. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Letter Flower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}

/* Layout: one column garden; growing plant beside the score, the letter flower is the hero, found words below. */
:root{
  --sky:#eef6f7; --card:#ffffff; --ink:#23323a; --muted:#5d6f78;
  --petal:#ffd6e3; --petal-ink:#7a1f45; --center:#ffc93c; --center-ink:#3d2a00;
  --leaf:#3f9b5a; --leaf-soft:#d5efdc; --line:#cfe1e4; --warn:#b5452b;
  /* Fallbacks matter: offline (and on Android without Trebuchet/Comic Sans) these land on system-ui. */
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#142227; --card:#1c2e34; --ink:#eaf3f4; --muted:#a6bac0;
  --petal:#6b2a46; --petal-ink:#ffe3ee; --center:#f2b827; --center-ink:#2a1c00;
  --leaf:#6fcf8a; --leaf-soft:#20402c; --line:#2f4950; --warn:#ff9a7f; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#142227; --card:#1c2e34; --ink:#eaf3f4; --muted:#a6bac0;
  --petal:#6b2a46; --petal-ink:#ffe3ee; --center:#f2b827; --center-ink:#2a1c00;
  --leaf:#6fcf8a; --leaf-soft:#20402c; --line:#2f4950; --warn:#ff9a7f; color-scheme:dark}
/* overscroll-behavior:none stops Chrome's pull-to-refresh from reloading the game mid-word. */
html,body{background:var(--sky);color:var(--ink);overscroll-behavior:none}
/* No text selection, long-press callout/menu, Touch-to-Search or grey tap flash anywhere in the game. */
body{font-family:var(--read);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* Variant B "Big Flower": one fixed screen. The page never scrolls; the flower takes whatever height is left. */
:root{padding:0}
html,body{height:100%;overflow:hidden}
.wrap{box-sizing:border-box;height:100vh;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;
  gap:clamp(2px,1dvh,8px);padding:max(6px,env(safe-area-inset-top,0px)) 12px max(8px,env(safe-area-inset-bottom,0px))}
.top{flex:none;display:flex;align-items:center;gap:8px;min-height:52px}
.ham{flex:none;width:52px;height:52px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);
  font:800 1.7rem var(--display);line-height:1;padding:0;cursor:pointer;touch-action:none}
.title{flex:1 1 auto;min-width:0;font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,5.6vw,1.7rem);line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bloombox{flex:none;display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:2px 10px 2px 4px}
.bloombox .count{font:800 1.25rem var(--display);color:var(--ink);white-space:nowrap}
.recent{flex:none;display:flex;gap:5px;align-items:center;height:40px;overflow:hidden;white-space:nowrap}
.recent .lbl{flex:none;color:var(--muted);font-size:1rem}
/* fix-b: smaller padding and no ⭐ prefix (pink already marks a bonus word) so 3 long words fit at 360 wide. */
.recent button{flex:none;font:700 1.1rem var(--read);color:var(--ink);background:var(--leaf-soft);border:none;border-radius:12px;
  height:38px;padding:0 9px;cursor:pointer;touch-action:none}
.recent button.bonus{background:var(--petal);color:var(--petal-ink)}
.recent .empty{font-size:1rem}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:700 .95rem var(--read);background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;touch-action:none}
.chip[aria-pressed="false"]{color:var(--muted)}
.score{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 16px}
.score svg{flex:none}
.rank{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1}
.count{color:var(--muted);font-size:1.05rem}
.word{flex:none;height:clamp(44px,8dvh,64px);display:flex;align-items:center;justify-content:center;font-size:clamp(1.9rem,9.2vw,3rem);font-weight:700;letter-spacing:.05em;white-space:nowrap;overflow:hidden}
.word .c{color:var(--leaf)}
.word .caret{display:inline-block;width:3px;height:1em;background:var(--ink);margin-left:4px;animation:blink 1s steps(1) infinite;vertical-align:-.12em}
.word.full{animation:full .35s}
@keyframes full{25%{transform:translateX(-6px);color:var(--warn)}75%{transform:translateX(6px);color:var(--warn)}}
@keyframes blink{50%{opacity:0}}
.msg{flex:none;height:1.6em;line-height:1.6em;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(1.05rem,5vw,1.35rem);color:var(--leaf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.no{color:var(--warn)}
/* Status row: the peek hint ("t _ _") or, once every word is found, the big Next flower button. Fixed height so
   the flower never jumps. */
.status{flex:none;height:52px;display:flex;align-items:center;justify-content:center}
.hintline{font-size:1.6rem;letter-spacing:.15em;font-weight:700}
.nextbig{font:800 1.3rem var(--display);height:52px;padding:0 24px;border-radius:999px;border:3px solid var(--leaf);background:var(--leaf);color:var(--card);cursor:pointer;touch-action:none}
/* The stage takes every pixel left over; the flower is the largest square that fits it (container query units). */
.stage{flex:1 1 0;min-height:0;position:relative;container-type:size}
/* touch-action:none on the flower: no pan, zoom or double-tap gesture can start on the letters. */
.flower{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100cqw,100cqh);aspect-ratio:1;touch-action:none;container-type:inline-size}
.flower button{position:absolute;width:31%;aspect-ratio:1;border-radius:50%;border:none;font:700 15cqw var(--read);cursor:pointer;transform:translate(-50%,-50%);transition:transform .12s;touch-action:none;padding:0 0 .12em}
/* Peek and Hear sit in the flower's empty bottom corners, near the thumbs. Sized from the flower, never below 52px. */
.helper{position:absolute;bottom:calc(50% - min(50cqw,50cqh));width:max(56px,min(17cqw,17cqh,76px));aspect-ratio:1;border-radius:50%;border:3px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;touch-action:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.helper .i{font-size:1.6rem}
.helper .t{font:800 .8rem var(--display);margin-top:2px}
/* fix-b: anchored to the stage's corners, not the flower's: when the stage is wider than the flower (short
   screens, e.g. 360x640) this moves them outward, away from the bottom petals (gap was 6px). */
#peek{left:0}
#hear{right:0}
.flower button.o{background:var(--petal);color:var(--petal-ink)}
.flower button.m{background:var(--center);color:var(--center-ink);box-shadow:0 0 0 6px var(--leaf-soft)}
.flower button:active{transform:translate(-50%,-50%) scale(.9)}
.flower button:focus-visible,.btn:focus-visible,.chip:focus-visible,.found button:focus-visible,.ham:focus-visible,.helper:focus-visible,
.recent button:focus-visible,.levels button:focus-visible,.nextbig:focus-visible{outline:4px solid var(--leaf);outline-offset:3px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
/* Action buttons fire on pointerup inside the button; touch-action:none so a slight slide is not taken as a scroll. */
.btn{font:800 1.2rem var(--display);border-radius:999px;padding:10px 20px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;min-width:96px;touch-action:none}
/* Thumb-zone bar: three big icon buttons, Check wider and green so it reads as the main one. */
.bar{flex:none;display:flex;gap:10px;width:100%}
.bar .btn{flex:1 1 0;min-width:0;height:clamp(60px,10dvh,76px);padding:0 4px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bar .btn .i{font-size:1.9rem}
.bar .btn .t{font-size:.95rem;margin-top:3px}
.bar .btn.go{flex-grow:1.7}
.bar .btn.go .i{font-size:2.2rem}
.btn.go{background:var(--leaf);border-color:var(--leaf);color:var(--card)}
/* Menu: a sheet from the left over a dimmed backdrop. Closed = [hidden] (display:none), so nothing in it can be
   tapped or tabbed to and the checker does not see off-screen buttons. */
.menu{position:fixed;inset:0;z-index:10;display:flex}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);touch-action:none}
.sheet{position:relative;width:min(88vw,420px);height:100%;background:var(--sky);display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.3)}
.sheet-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:max(8px,env(safe-area-inset-top,0px)) 12px 8px 16px}
.sheet-top h2{margin:0;font:800 1.6rem var(--display)}
.sheet-body{flex:1 1 auto;min-height:0;padding:4px 14px max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .chip{min-height:48px;font-size:1.05rem}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.levels button{min-height:56px;font:700 1rem var(--read);border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:4px 6px;line-height:1.15}
.levels button small{display:block;font-size:.85rem;color:var(--muted)}
.levels button.cur{border-color:var(--leaf);border-width:3px}
.levels button.done{background:var(--leaf-soft)}
.howto{margin:0;padding-left:1.3em;font-size:1.1rem;line-height:1.45}
.rankline{font:800 1.1rem var(--display);color:var(--leaf)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-family:var(--display);font-size:1.15rem}
.found{display:flex;flex-wrap:wrap;gap:8px}
.found button{font:700 1.3rem var(--read);color:var(--ink);background:var(--leaf-soft);border:none;border-radius:12px;padding:4px 12px;cursor:pointer}
.found button.bonus{background:var(--petal);color:var(--petal-ink)}
/* Scrollable inner regions (menu panel, level list, a long found-word list).
   touch-action:none is set on the game buttons themselves (flower, .btn, .chip), never on a container, so a
   region opts back in to vertical scrolling just by carrying class="scroll". Buttons inside it allow pan-y:
   a swipe that starts on one scrolls the list, Chrome sends pointercancel, and onTap treats that as no tap.
   Rule for variants: never put touch-action:none on an ancestor of a .scroll region (the browser intersects
   touch-action down the tree, so it would block the scroll), and wire its buttons with onTap. */
.scroll{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.scroll button,.found button{touch-action:pan-y}
.note{font-size:.95rem;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:1.05rem}
.left{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:1.05rem}
.left b{color:var(--ink)}
.hintline{font-size:1.6rem;letter-spacing:.15em;font-weight:700;min-height:1.6em}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted)}
.grow{transition:all .5s}
@media (prefers-reduced-motion:reduce){.grow,.flower button{transition:none}.word .caret{animation:none}.word.full{animation:none}}
</style>
</head>
<body>

<div class="wrap" id="game">
  <div class="top">
    <button class="ham" id="menubtn" aria-label="Menu" aria-haspopup="dialog" aria-controls="menu" aria-expanded="false">☰</button>
    <div class="title" id="pnum">Level Daisy</div>
    <div class="bloombox" aria-label="Words found">
      <svg id="plant" width="40" height="46" viewBox="0 0 64 72" aria-hidden="true">
        <rect x="10" y="60" width="44" height="12" rx="4" fill="var(--warn)" opacity=".75"/>
        <rect id="stem" class="grow" x="30" y="60" width="4" height="0" rx="2" fill="var(--leaf)"/>
        <ellipse id="leafL" class="grow" cx="24" cy="46" rx="8" ry="4" fill="var(--leaf)" opacity="0"/>
        <ellipse id="leafR" class="grow" cx="40" cy="38" rx="8" ry="4" fill="var(--leaf)" opacity="0"/>
        <g id="bloom" class="grow" opacity="0">
          <circle cx="32" cy="10" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
          <circle cx="22" cy="17" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
          <circle cx="42" cy="17" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
          <circle cx="26" cy="28" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
          <circle cx="38" cy="28" r="7" fill="var(--petal)" stroke="var(--petal-ink)" stroke-width="1"/>
          <circle cx="32" cy="20" r="6" fill="var(--center)"/>
        </g>
      </svg>
      <span class="count" id="mini">0/0</span>
    </div>
  </div>

  <div class="recent" id="recent"></div>

  <div class="msg" id="msg" role="status">Every word needs the yellow letter!</div>
  <div class="status">
    <div class="hintline" id="hintline" aria-live="polite"></div>
    <button class="nextbig" id="nextbig" hidden>Next flower ▶</button>
  </div>
  <div class="word" id="word" aria-live="polite"></div>

  <div class="stage">
    <div class="flower" id="flower"></div>
    <button class="helper" id="peek" aria-label="Peek a letter"><span class="i" aria-hidden="true">👀</span><span class="t">Peek</span></button>
    <button class="helper" id="hear" aria-label="Hear a word"><span class="i" aria-hidden="true">👂</span><span class="t">Hear</span></button>
  </div>

  <div class="bar">
    <button class="btn" id="del" aria-label="Back"><span class="i" aria-hidden="true">⌫</span><span class="t">Back</span></button>
    <button class="btn" id="mix" aria-label="Mix"><span class="i" aria-hidden="true">🔄</span><span class="t">Mix</span></button>
    <button class="btn go" id="enter" aria-label="Check"><span class="i" aria-hidden="true">✓</span><span class="t">Check</span></button>
  </div>
</div>

<!-- Menu sheet. Outside #game so #game can be made inert while it is open. -->
<div class="menu" id="menu" role="dialog" aria-modal="true" aria-labelledby="menutitle" hidden>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet">
    <div class="sheet-top">
      <h2 id="menutitle">Menu</h2>
      <button class="btn" id="close" aria-label="Close menu">✕</button>
    </div>
    <div class="sheet-body scroll" id="sheetbody">
      <div class="tools">
        <button class="chip" id="sound" aria-pressed="true">🔊 Sound on</button>
        <button class="chip" id="shuf" aria-pressed="false">🔀 Mix up the flowers</button>
      </div>

      <section class="panel">
        <h2>Words I found <span class="rankline" id="rank">Seed</span></h2>
        <div class="count" id="count">0 of 0 words</div>
        <div class="found" id="found"></div>
        <p class="note" id="bonusnote" hidden>⭐ Pink words are bonus words.</p>
      </section>

      <section class="panel">
        <h2>Words still hiding</h2>
        <div class="left" id="left"></div>
      </section>

      <section class="panel">
        <h2>Flowers</h2>
        <div class="tools">
          <button class="chip" id="prev">◀ Last flower</button>
          <button class="chip" id="next">Next flower ▶</button>
        </div>
        <div class="levels" id="levels"></div>
      </section>

      <section class="panel">
        <h2>How to play</h2>
        <ol class="howto">
          <li>Tap letters to make a word.</li>
          <li>Every word needs the yellow letter.</li>
          <li>Tap ✓ Check.</li>
          <li>Stuck? Tap 👀 Peek or 👂 Hear.</li>
        </ol>
      </section>
    </div>
  </div>
</div>

<script>
/*
 * Levels. Each puzzle: id (permanent save key), name (shown as "Level <name>"),
 * c = center letter (in every word), o = the six petal letters, w = target words, b = bonus words.
 *
 * Order is baked, not computed at runtime, so it is the same on every device and reload.
 * It was produced ONCE from the original letter-flower.html P array (original puzzles 1..30) by a
 * Fisher-Yates shuffle (for i = n-1 down to 1: j = floor(rand() * (i+1)); swap i, j) driven by
 * mulberry32 with seed 20261017; names were then assigned in list order (Daisy, Tulip, Rose, ...).
 * Bonus lists had these non-kid entries removed: bafta brit goa otto orc parr tor playa hath thee
 * thine ken roc ted mon monte conte carte chino newton. Target (w) words were not touched.
 */
const P=[
  {"id":"daisy","name":"Daisy","c":"i","o":"begprt","w":["bib","big","bit","bite","pie","pig","pit","tie","tiger","tip","trip"],"b":["beige","bigger","bitter","bribe","brig","eerie","gig","grip","grit","ire","petit","petite","pier","pip","pipe","piper","retire","rib","rig","rip","ripe","ripper","rite","terrier","tier","tire","tribe","trigger"]},
  {"id":"tulip","name":"Tulip","c":"n","o":"deiopw","w":["down","end","need","new","nine","noon","now","one","open","own","pen","pin","pine","pond","win","wind"],"b":["deepen","den","depend","din","dine","don","done","indeed","inn","iodine","ion","nip","nod","node","non","none","nope","onion","opinion","widen","window","wine","won","wooden"]},
  {"id":"rose","name":"Rose","c":"p","o":"acirtu","w":["cap","cup","part","pat","pit","pup","put","rap","tap","tip","trap","trip"],"b":["apart","apt","carp","pact","pair","pap","papa","par","para","pic","pip","pita","putt","rip"]},
  {"id":"sunflower","name":"Sunflower","c":"a","o":"bdoprt","w":["add","art","bad","bar","bat","boat","dad","oat","pad","part","pat","rap","rat","road","tap","tar","toad","trap"],"b":["abbot","aboard","abort","abroad","adapt","ado","adopt","apart","apt","arbor","atop","baba","barb","bard","boa","boar","board","brad","brat","broad","dab","dart","data","dorado","drab","pap","papa","par","para","parrot","potato","radar","rapport","raptor","roar","tab","taboo","tarot","tart","tat","tattoo"]},
  {"id":"lily","name":"Lily","c":"l","o":"abempy","w":["all","apple","ball","bell","lamb","lamp","lap","meal","play","yell"],"b":["able","ale","alley","ally","alma","ample","appeal","apply","bale","balm","belle","belly","blame","eel","elm","emblem","eyeball","lab","label","lama","lame","lay","leap","lee","male","mall","mammal","maple","melee","pal","pale","palm","palpable","papal","payable","pebble","peel","plea","ply","yelp"]},
  {"id":"poppy","name":"Poppy","c":"d","o":"aegorw","w":["add","dad","dear","deer","dog","draw","good","odd","red","road","weed","wood","word"],"b":["added","ado","adore","aged","award","dagger","dare","dead","dee","deed","degrade","degraded","degree","dew","dodge","dodger","doe","door","dorado","drag","drawer","dread","dredge","drew","edge","edged","erode","eroded","grade","graded","grader","greed","ode","odor","order","ordered","radar","ragged","read","reader","redwood","reed","regard","reread","reward","rod","rode","rodeo","wade","ward","wed","wedge","wooded"]},
  {"id":"violet","name":"Violet","c":"p","o":"ahilot","w":["hop","lap","lip","loop","pat","pit","pool","pop","pot","tap","tip","top"],"b":["alpha","apt","atop","hap","hilltop","hip","hippo","hoop","lollipop","opal","pal","pap","papa","papal","path","patio","photo","pill","pilot","pip","pita","plot","poll","polo","pooh","potato"]},
  {"id":"pansy","name":"Pansy","c":"t","o":"abegnu","w":["ant","ate","bat","bet","but","eat","gate","get","neat","net","nut","tag","tan","ten","tent","tub","tug","tuna"],"b":["agent","ante","antenna","aunt","beat","beaten","beet","bent","beta","butt","butte","eaten","gut","nugget","tab","tang","tangent","tat","tea","tee","teen","teenage","tenant","tenet","tube","tune","unbeaten"]},

function goIndex(i) { idx = i; load(); }
// Next/prev follow the current order (baked, or this startup's shuffle), wrapping at the ends.
function step(d) { const n = order.length; goIndex(order[(order.indexOf(idx) + d + n) % n]); }
function setShuffle(on) {
  shuffleOn = !!on; store.set('lf2-shuffle', shuffleOn);
  order = makeOrder();   // stays on the current level; only what comes next changes
  render();
}

onTap($('hear'), hear);
onTap($('peek'), peek);
onTap($('del'), back);
onTap($('enter'), check);
onTap($('mix'), mix);
onTap($('next'), () => step(1));
onTap($('prev'), () => step(-1));

const sb = $('sound');
function setSound() {
  if (!TTS) { sb.textContent = '🔇 No voice here'; sb.disabled = true; sb.title = 'This browser or app has no speech. Try opening the game in Safari or Chrome.'; $('hear').hidden = true; return; }
  sb.textContent = sound ? '🔊 Sound on' : '🔇 Sound off'; sb.setAttribute('aria-pressed', sound);
}
onTap(sb, () => { sound = !sound; store.set('lf2-sound', sound); setSound(); if (sound) say('Sound on'); });
setSound();

// Physical keyboard. Enter/Space on a button the player reached with Tab activate that button natively;
// otherwise Enter = Check, Space = Mix, Backspace = Back, letters type. (Not :focus-visible: Chrome turns
// that on for a mouse-focused button as soon as any key is typed, which would make Enter add a letter.)
let tabFocused = null, lastInputKey = false;
document.addEventListener('pointerdown', () => { lastInputKey = false; tabFocused = null; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Tab') lastInputKey = true; }, true);
document.addEventListener('focusin', e => { tabFocused = lastInputKey ? e.target : null; });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), p = P[idx], t = e.target;
  if ((k === 'enter' || k === ' ') && t && t.tagName === 'BUTTON' && t === tabFocused) return;
  if (k === 'enter') { e.preventDefault(); check(); }
  else if (k === 'backspace') { e.preventDefault(); back(); }
  else if (k === ' ') { e.preventDefault(); mix(); }
  else if (k.length === 1 && (k === p.c || p.o.includes(k))) { if (!e.repeat) type(k); }
});

/* ---------- API for layout variants ---------- */
// levels: every level in the baked order (fixed). order(): ids in the order play currently follows.
// state().index is the position of the current level in order() (equal to its baked index when shuffle is off).
// onChange(fn) is called after every render; a listener may call goTo/setShuffle, see the guard in render().
window.Game = {
  levels: P.map(p => ({ id: p.id, name: p.name })),
  goTo(id) { const i = indexOf(id); if (i < 0) return false; goIndex(i); return true; },
  state() {
    const p = P[idx];
    return { id: p.id, name: p.name, index: order.indexOf(idx), typed, found: found.slice(), bonus: bonus.slice(), total: p.w.length, done: found.length === p.w.length };
  },
  // Progress for any level without switching to it (for a level picker).
  progress(id) { const p = P[indexOf(id)]; if (!p) return null; return { found: clean(store.get('lf2-found-' + p.id, []), p.w).length, total: p.w.length }; },
  onChange(fn) { listeners.push(fn); },
  get shuffle() { return shuffleOn; },
  setShuffle,
  order() { return order.map(i => P[i].id); }
};

/* ---------- Variant B "Big Flower": main-screen extras and the menu ---------- */
// Every button here is wired with onTap (actions) like core's own, never onclick.
const menu = $('menu'), menuBtn = $('menubtn');
menu.addEventListener('contextmenu', e => e.preventDefault());

// Recent words, newest first. The order across found + bonus is saved in lf2-recent-<id> (newest first, capped),
// so it survives a reload. Words the save does not know about (found in another variant, which does not write
// this key) go after the saved ones, newest-saved-first. The lf2- prefix keeps it under index.html's reset.
const RECENT_MAX = 4, RECENT_SAVE = 12;
let recent = [], recentId = null, seen = new Set(), recentKey = null;
function updateRecent(s) {
  const all = [...s.found, ...s.bonus], saveKey = 'lf2-recent-' + s.id;
  if (s.id !== recentId) {
    recentId = s.id;
    const saved = clean(store.get(saveKey, []), all);
    recent = saved.concat(all.slice().reverse().filter(w => !saved.includes(w)));
  } else {
    const fresh = all.filter(w => !seen.has(w));
    fresh.forEach(w => recent.unshift(w));
    recent = recent.filter(w => all.includes(w));
    if (fresh.length) store.set(saveKey, recent.slice(0, RECENT_SAVE));
  }
  seen = new Set(all);
  const show = recent.slice(0, RECENT_MAX), key = s.id + '|' + show.join();
  if (key === recentKey) return;   // rebuild only on change, so a finger resting on a word is not dropped
  recentKey = key;
  const r = $('recent'); r.innerHTML = '';
  if (!show.length) { r.innerHTML = '<span class="empty">Find a word! 🌱</span>'; return; }
  r.insertAdjacentHTML('beforeend', '<span class="lbl">New:</span>');
  show.forEach(w => {
    const b = document.createElement('button');
    b.textContent = w;
    if (s.bonus.includes(w)) b.className = 'bonus';
    b.setAttribute('aria-label', 'Hear ' + (s.bonus.includes(w) ? 'bonus word ' : '') + w);
    onTap(b, () => say(w));
    r.appendChild(b);
  });
  fitRecent();
}
// The row never wraps or scrolls: a word that would not fit whole is hidden rather than cut off, and so is every
// older word after it, so what shows is always the newest few in order.
function fitRecent() {
  const r = $('recent'), right = r.getBoundingClientRect().right;
  let full = false;
  r.querySelectorAll('button').forEach(b => b.hidden = false);
  r.querySelectorAll('button').forEach(b => { if (full || b.getBoundingClientRect().right > right + .5) { b.hidden = true; full = true; } });
}
// "Level <name>" must show whole: long names (Snapdragon, Sunflower...) shrink the font to fit instead of being
// ellipsized. Floor 14px; below that the CSS ellipsis is the last resort.
function fitTitle() {
  const t = $('pnum');
  t.style.fontSize = '';
  if (t.scrollWidth <= t.clientWidth) return;
  const px = parseFloat(getComputedStyle(t).fontSize) * t.clientWidth / t.scrollWidth;
  t.style.fontSize = Math.max(14, Math.floor(px * 2) / 2) + 'px';
}
function refit() { fitTitle(); fitRecent(); }
window.addEventListener('resize', refit);
// Online web fonts swap in after the first fit and change text widths.
try { document.fonts.ready.then(refit); } catch (e) {}

function buildLevels() {
  const cur = Game.state().id, box = $('levels');
  box.innerHTML = '';
  Game.order().forEach(id => {   // follows shuffle mode
    const lv = Game.levels.find(l => l.id === id), pr = Game.progress(id), done = pr.found === pr.total;
    const b = document.createElement('button');
    b.innerHTML = (done ? '🌸 ' : '') + lv.name + '<small>' + pr.found + ' of ' + pr.total + '</small>';
    if (done) b.classList.add('done');
    if (id === cur) { b.classList.add('cur'); b.setAttribute('aria-current', 'true'); }
    b.setAttribute('aria-label', 'Level ' + lv.name + ', ' + pr.found + ' of ' + pr.total + ' words');
    onTap(b, () => { Game.goTo(id); closeMenu(); });
    box.appendChild(b);
  });
}
const shufBtn = $('shuf');
function setShufLabel() { shufBtn.textContent = '🔀 Mix up the flowers: ' + (Game.shuffle ? 'On' : 'Off'); shufBtn.setAttribute('aria-pressed', Game.shuffle); }
onTap(shufBtn, () => { Game.setShuffle(!Game.shuffle); setShufLabel(); buildLevels(); });
setShufLabel();

// While the menu is open the game is inert and covered by the backdrop, so no letter tap can reach it, and the
// keyboard handler below keeps keys from typing into the game.
function openMenu() {
  if (!menu.hidden) return;
  buildLevels();
  menu.hidden = false; $('game').inert = true; menuBtn.setAttribute('aria-expanded', 'true');
  $('sheetbody').scrollTop = 0;
  $('close').focus({ preventScroll: true });
}
// Stray-click guard. On touch, Chrome hit-tests the click that follows a tap again after pointerup. When the tap
// changed what is under the finger (menu closed, menu opened, level picked) that click lands on a different
// element -- found by test: choosing "Rose" in the level list typed a "u", the letter under it. Every game
// handler acts on pointerdown/pointerup and ignores clicks, so a click within CLICK_AFTER_UP_MS of a pointerup
// that lands outside the element the pointer went down on is dropped. This covers opening as well as closing.
// Keyboard and screen-reader clicks have no pointer contact before them and pass.
let pdTarget = null, puAt = -Infinity;
window.addEventListener('pointerdown', e => { pdTarget = e.target; }, true);
window.addEventListener('pointerup', () => { puAt = performance.now(); }, true);
window.addEventListener('click', e => {
  if (performance.now() - puAt < CLICK_AFTER_UP_MS && pdTarget && e.target instanceof Node &&
      !pdTarget.contains(e.target) && !e.target.contains(pdTarget)) { e.stopPropagation(); e.preventDefault(); }
}, true);
// Post-close lockout. A child's double tap on the backdrop or a level button: tap 1 closes the menu, and tap 2's
// pointerdown lands on the letters that were just uncovered and types one (seen in test: typed "e"). The click
// guard above cannot stop that -- it is a real pointerdown. So for LOCK_MS after the menu closes or the level
// changes from the menu / Next flower, pointerdowns inside #game are dropped before any game handler sees them.
const LOCK_MS = 300;
let lockUntil = 0;
const lockGame = () => { lockUntil = performance.now() + LOCK_MS; };
window.addEventListener('pointerdown', e => {
  if (performance.now() < lockUntil && e.target instanceof Node && $('game').contains(e.target)) { e.stopPropagation(); e.preventDefault(); }
}, true);
function closeMenu() {
  if (menu.hidden) return;
  lockGame();
  menu.hidden = true; $('game').inert = false; menuBtn.setAttribute('aria-expanded', 'false');
  menuBtn.focus({ preventScroll: true });
}
onTap(menuBtn, openMenu);
onTap($('close'), closeMenu);
onTap($('backdrop'), closeMenu);
onTap($('nextbig'), () => { lockGame(); step(1); });
// Capture phase on window runs before core's document keydown handler. Native Enter/Space activation of a
// focused menu button is a default action, so it still works after stopPropagation.
window.addEventListener('keydown', e => {
  if (menu.hidden) return;
  if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }
  e.stopPropagation();
}, true);

let titleId = null;
Game.onChange(s => {
  if (s.id !== titleId) { titleId = s.id; fitTitle(); }
  updateRecent(s);
  $('mini').textContent = s.found.length + '/' + s.total;
  $('nextbig').hidden = !s.done;
  $('hintline').hidden = s.done;
  if (!menu.hidden) buildLevels();
});

load();
</script>
</body>
</html>
